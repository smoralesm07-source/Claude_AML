<meta charset="utf-8">
<title>IFL Cockpit</title>
<style>
@import url('data:text/css,');
:root{
  --bg:#070d1a;--s1:#0c1525;--s2:#101c30;--s3:#162540;
  --bd:rgba(255,255,255,0.07);--bds:#1e3050;
  --tx:#ddeafc;--tx2:#7090bc;--txm:#354f78;
  --ac:#3b82f6;--ac2:#1d4ed8;--acg:linear-gradient(135deg,#1d4ed8,#3b82f6);
  --cr:#ef4444;--cr-bg:rgba(239,68,68,.12);
  --ch:#f97316;--ch-bg:rgba(249,115,22,.12);
  --cm:#eab308;--cm-bg:rgba(234,179,8,.12);
  --cl:#22c55e;--cl-bg:rgba(34,197,94,.12);
  --sii:#10b981;--sii-bg:rgba(16,185,129,.15);--sii-tx:#34d399;
  --uaf:#a78bfa;--uaf-bg:rgba(167,139,250,.15);--uaf-tx:#c4b5fd;
  --cgr:#38bdf8;--cgr-bg:rgba(56,189,248,.15);--cgr-tx:#7dd3fc;
  --del:#f87171;--del-bg:rgba(248,113,113,.15);--del-tx:#fca5a5;
  --pre:#fbbf24;--pre-bg:rgba(251,191,36,.15);--pre-tx:#fcd34d;
  --san:#818cf8;--san-bg:rgba(129,140,248,.15);--san-tx:#a5b4fc;
  --osl:#22d3ee;--osl-bg:rgba(34,211,238,.15);--osl-tx:#67e8f9;
  --sid:224px;--top:54px;
  --rad:10px;--rad-sm:7px;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f0f4fb;--s1:#fff;--s2:#f5f8fe;--s3:#eaf0fb;
  --bd:rgba(0,0,0,0.07);--bds:#d0daea;
  --tx:#0d1e3a;--tx2:#3d5278;--txm:#8098b8;
  --ac:#1d4ed8;--ac2:#1e40af;
  --cr:#dc2626;--cr-bg:rgba(220,38,38,.09);
  --ch:#ea580c;--ch-bg:rgba(234,88,12,.09);
  --cm:#ca8a04;--cm-bg:rgba(202,138,4,.09);
  --cl:#16a34a;--cl-bg:rgba(22,163,74,.09);
  --sii:#059669;--sii-bg:rgba(5,150,105,.1);--sii-tx:#047857;
  --uaf:#7c3aed;--uaf-bg:rgba(124,58,237,.1);--uaf-tx:#6d28d9;
  --cgr:#0284c7;--cgr-bg:rgba(2,132,199,.1);--cgr-tx:#0369a1;
  --del:#dc2626;--del-bg:rgba(220,38,38,.1);--del-tx:#b91c1c;
  --pre:#b45309;--pre-bg:rgba(180,83,9,.1);--pre-tx:#92400e;
  --san:#4338ca;--san-bg:rgba(67,56,202,.1);--san-tx:#3730a3;
  --osl:#0e7490;--osl-bg:rgba(14,116,144,.1);--osl-tx:#155e75;
}}
:root[data-theme=light]{
  --bg:#f0f4fb;--s1:#fff;--s2:#f5f8fe;--s3:#eaf0fb;
  --bd:rgba(0,0,0,0.07);--bds:#d0daea;
  --tx:#0d1e3a;--tx2:#3d5278;--txm:#8098b8;
  --ac:#1d4ed8;--ac2:#1e40af;
  --cr:#dc2626;--cr-bg:rgba(220,38,38,.09);
  --ch:#ea580c;--ch-bg:rgba(234,88,12,.09);
  --cm:#ca8a04;--cm-bg:rgba(202,138,4,.09);
  --cl:#16a34a;--cl-bg:rgba(22,163,74,.09);
  --sii:#059669;--sii-bg:rgba(5,150,105,.1);--sii-tx:#047857;
  --uaf:#7c3aed;--uaf-bg:rgba(124,58,237,.1);--uaf-tx:#6d28d9;
  --cgr:#0284c7;--cgr-bg:rgba(2,132,199,.1);--cgr-tx:#0369a1;
  --del:#dc2626;--del-bg:rgba(220,38,38,.1);--del-tx:#b91c1c;
  --pre:#b45309;--pre-bg:rgba(180,83,9,.1);--pre-tx:#92400e;
  --san:#4338ca;--san-bg:rgba(67,56,202,.1);--san-tx:#3730a3;
  --osl:#0e7490;--osl-bg:rgba(14,116,144,.1);--osl-tx:#155e75;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden;font-size:13px;line-height:1.5}
/* SIDEBAR */
#sb{width:var(--sid);background:var(--s1);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:50;border-right:1px solid var(--bd)}
.brand{padding:20px 16px 16px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.brand-tag{font-size:9px;letter-spacing:3px;color:var(--ac);font-weight:800;text-transform:uppercase;margin-bottom:6px;opacity:.9}
.brand-name{font-size:16px;color:var(--tx);font-weight:800;line-height:1.15;letter-spacing:-.03em}
.brand-ver{font-size:10px;color:var(--txm);margin-top:5px;font-variant-numeric:tabular-nums}
.nav-sec{padding:4px 0}
.nav-lbl{padding:8px 16px 3px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--txm);text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 12px;cursor:pointer;border:none;background:0 0;color:var(--tx2);width:100%;text-align:left;font-size:12.5px;transition:.12s;border-left:3px solid transparent;font-family:inherit;font-weight:500}
.ni:hover{background:rgba(59,130,246,.07);color:var(--tx)}
.ni.on{background:rgba(59,130,246,.1);color:var(--ac);border-left-color:var(--ac)}
.ni-ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni-bd{margin-left:auto;background:var(--cr);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:99px;min-width:18px;text-align:center}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tb{height:var(--top);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
#tb-title{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:-.02em}
#tb-sep{color:var(--bds);font-size:16px;margin:0 2px}
#ct{flex:1;overflow-y:auto;padding:22px}
/* CONTROLS */
.fsel{border:1px solid var(--bd);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--tx2);background:var(--s2);cursor:pointer;font-family:inherit;font-weight:500}
.fbtn{border:1px solid var(--bd);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--s2);color:var(--tx2);font-family:inherit;transition:.12s;font-weight:500}
.fbtn.on,.fbtn:hover{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:var(--ac)}
.sinp{border:1px solid var(--bd);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--tx);background:var(--s2);width:200px;font-family:inherit}
.sinp:focus{outline:none;border-color:rgba(59,130,246,.5);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fbr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tb-acts{margin-left:auto;display:flex;gap:6px}
.btn{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--tx2);font-family:inherit;transition:.12s}
.btn:hover{border-color:rgba(59,130,246,.3);color:var(--ac)}
.btn-p{background:var(--acg);color:#fff;border-color:transparent}
.btn-p:hover{opacity:.9;color:#fff}
/* LAYOUT */
.mh{margin-bottom:20px}
.mh h1{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.03em;line-height:1.1}
.mh p{font-size:12px;color:var(--tx2);margin-top:4px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--s1);border-radius:var(--rad);padding:14px 16px;border:1px solid var(--bd);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kc,var(--ac))}
.kpi.sii{--kc:var(--sii)}.kpi.uaf{--kc:var(--uaf)}.kpi.cgr{--kc:var(--cgr)}
.kpi.del{--kc:var(--del)}.kpi.pre{--kc:var(--pre)}.kpi.san{--kc:var(--san)}
.kpi.osl{--kc:var(--osl)}.kpi.cr{--kc:var(--cr)}.kpi.hi{--kc:var(--ch)}.kpi.acc{--kc:var(--ac)}
.kl{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:28px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ks{font-size:11px;color:var(--txm)}
.ksp{position:absolute;bottom:10px;right:12px;opacity:.7}
.card{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:16px;margin-bottom:14px}
.ct{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:12px;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
/* BADGES */
.bd{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.1px}
.bd.sii{background:var(--sii-bg);color:var(--sii-tx)}.bd.uaf{background:var(--uaf-bg);color:var(--uaf-tx)}
.bd.cgr{background:var(--cgr-bg);color:var(--cgr-tx)}.bd.del{background:var(--del-bg);color:var(--del-tx)}
.bd.pre{background:var(--pre-bg);color:var(--pre-tx)}.bd.san{background:var(--san-bg);color:var(--san-tx)}
.bd.osl{background:var(--osl-bg);color:var(--osl-tx)}
.rk{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700}
.rk.cr{background:var(--cr-bg);color:var(--cr)}.rk.hi{background:var(--ch-bg);color:var(--ch)}
.rk.md{background:var(--cm-bg);color:var(--cm)}.rk.lo{background:var(--cl-bg);color:var(--cl)}
/* TABLE */
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
.dtbl td{padding:9px 10px;border-bottom:1px solid var(--bd)}
.dtbl tr:last-child td{border-bottom:none}
.dtbl tbody tr:hover td{background:var(--s2)}
/* HALLAZGO CARDS */
.hcard{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:16px;margin-bottom:13px;transition:box-shadow .18s,transform .18s}
.hcard:hover{box-shadow:0 4px 24px rgba(0,0,0,.18);transform:translateY(-1px)}
.hcard.cr{border-top:2px solid var(--cr)}.hcard.hi{border-top:2px solid var(--ch)}
.hcard.md{border-top:2px solid var(--cm)}.hcard.lo{border-top:2px solid var(--cl)}
.htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.hid h3{font-size:14px;font-weight:700;letter-spacing:-.02em}
.hid .rut{font-size:11px;color:var(--txm);margin-top:2px;font-family:'SF Mono',Menlo,monospace}
.hid .metas{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.hscore{text-align:center;flex-shrink:0;margin-left:14px}
.sigs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.sc{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:500;border:1px solid}
.hyp{background:var(--s2);border-radius:7px;padding:10px 13px;margin-bottom:9px;border-left:3px solid var(--ac)}
.hyp-lbl{font-size:9px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.hyp-tx{font-size:12px;color:var(--tx2);line-height:1.6}
.nxt{display:flex;flex-wrap:wrap;gap:4px}
.nxt-s{background:var(--s2);padding:3px 9px;border-radius:5px;font-size:11px;color:var(--tx2);border:1px solid var(--bd)}
/* GUARDRAIL */
.gr{background:var(--s2);border:1px solid var(--bd);border-left:3px solid var(--txm);border-radius:7px;padding:10px 14px;font-size:11px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.gr strong{color:var(--tx)}
/* PROGRESS */
.pb{height:5px;background:var(--bd);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px}
/* TAG */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
/* REGION ROW */
.rrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.rrow:last-child{border-bottom:none}
.rname{width:160px;font-size:12px;flex-shrink:0;font-weight:500}
.rbw{flex:1}.rval{width:52px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.rct{width:50px;text-align:right;font-size:11px;color:var(--txm)}
/* ANOM */
.ac{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:14px;margin-bottom:10px}
.ah{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.at{font-size:13px;font-weight:700;letter-spacing:-.01em}
.adesc{font-size:12px;color:var(--tx2);margin-bottom:8px;line-height:1.6}
.aev{font-size:11px;color:var(--txm)}
/* METRIC PAIR */
.mpair{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.mpair .delta{font-size:11px;font-weight:600}
.delta.up{color:var(--cr)}.delta.dn{color:var(--cl)}
code.rut{font-family:'SF Mono',Menlo,monospace;font-size:12px;color:var(--tx2)}
@media(max-width:800px){.g2,.g3,.g12,.g21{grid-template-columns:1fr}}
/* ═══ ENTITY 360 · expediente analítico ═══════════════════════════
   Alcance: solo la sección Entity 360. Todas las clases van con
   prefijo e3- para no colisionar con el resto del cockpit, y los
   colores se toman de las variables ya definidas arriba. */
.e3-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.e3-inp{border:1px solid var(--bd);border-radius:7px;padding:7px 12px;font-size:12.5px;color:var(--tx);background:var(--s2);width:210px;font-family:'SF Mono',Menlo,monospace}
.e3-inp:focus{outline:none;border-color:rgba(59,130,246,.5);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.e3-hint{font-size:11px;color:var(--txm)}
.e3-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);font-weight:600}
.e3-live i{width:7px;height:7px;border-radius:50%;background:var(--cl);flex-shrink:0}
.e3-live.off i{background:var(--cm)}
.e3-live.err i{background:var(--cr)}

/* carátula */
.e3-head{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rad);padding:18px 18px 0;margin-bottom:14px;overflow:hidden}
.e3-htop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:start}
@media(max-width:900px){.e3-htop{grid-template-columns:1fr;gap:16px}}
.e3-name{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0}
.e3-meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:7px;align-items:center;font-size:11.5px;color:var(--tx2)}
.e3-sep{width:3px;height:3px;border-radius:50%;background:var(--txm);flex-shrink:0}
.e3-roles{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}

/* lecturas */
.e3-reads{display:flex;align-items:stretch}
@media(max-width:900px){.e3-reads{flex-wrap:wrap;gap:14px}}
.e3-read{padding:0 18px;border-left:1px solid var(--bd);min-width:124px}
.e3-reads .e3-read:first-child{border-left:0;padding-left:0}
@media(max-width:900px){.e3-reads .e3-read{border-left:0;padding:0 18px 0 0;min-width:110px}}
.e3-rk{font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--txm);display:block}
.e3-rv{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px}
.e3-rv small{font-size:13px;font-weight:600;color:var(--txm)}
.e3-rc{font-size:10.5px;color:var(--txm);margin-top:4px;line-height:1.4;max-width:150px}
.e3-tier{display:inline-block;font-size:17px;font-weight:800;padding:2px 10px;border-radius:6px;letter-spacing:-.01em}
.e3-tier.p1{background:var(--cr-bg);color:var(--cr)}
.e3-tier.p2{background:var(--ch-bg);color:var(--ch)}
.e3-tier.p3{background:var(--cm-bg);color:var(--cm)}
.e3-tier.na{background:var(--s3);color:var(--tx2);font-size:12px;font-weight:700;padding:5px 10px}

/* cinta de fuentes */
.e3-ribbon{display:flex;flex-wrap:wrap;margin:16px -18px 0;border-top:1px solid var(--bd)}
.e3-src{flex:1 1 122px;min-width:122px;padding:10px 13px 11px;border-right:1px solid var(--bd);border-top:0;border-bottom:0;border-left:0;background:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;position:relative;transition:background .12s}
.e3-src:last-child{border-right:0}
.e3-src:hover{background:var(--s2)}
.e3-src::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--e3c,var(--txm))}
.e3-sn{font-size:11px;font-weight:700;color:var(--tx)}
.e3-ss{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-top:4px;display:flex;align-items:center;gap:5px}
.e3-sa{font-size:10px;color:var(--txm);margin-top:2px;font-family:'SF Mono',Menlo,monospace}
.e3-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* lentes */
.e3-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:16px}
.e3-tab{background:0;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;color:var(--tx2);padding:9px 12px 8px;display:flex;align-items:baseline;gap:7px;white-space:nowrap;transition:.12s}
.e3-tab:hover{color:var(--tx)}
.e3-tab .n{font-family:'SF Mono',Menlo,monospace;font-size:10px;font-weight:600;opacity:.7}
.e3-tab .t{font-size:12.5px;font-weight:600}
.e3-tab[aria-selected="true"]{color:var(--ac);border-bottom-color:var(--ac)}
.e3-pane[hidden]{display:none}
.e3-lead{max-width:720px;margin-bottom:16px}
.e3-lead h2{font-size:17px;font-weight:800;letter-spacing:-.025em;margin:0}
.e3-lead p{font-size:12.5px;color:var(--tx2);margin:6px 0 0;line-height:1.6}

/* piezas */
.e3-note{background:var(--s2);border:1px solid var(--bd);border-left:3px solid var(--txm);border-radius:7px;padding:10px 13px;font-size:11.5px;color:var(--tx2);line-height:1.6;margin-top:12px}
.e3-note strong{color:var(--tx)}
.e3-note.warn{border-left-color:var(--cm);background:var(--cm-bg);color:var(--tx2)}
.e3-dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;font-size:12px}
.e3-dl dt{color:var(--tx2);padding:6px 0;border-bottom:1px solid var(--bd)}
.e3-dl dd{margin:0;padding:6px 0;border-bottom:1px solid var(--bd);text-align:right;font-weight:600}
.e3-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--s3);color:var(--tx2);white-space:nowrap}
.e3-pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.e3-pill.ok{background:var(--cl-bg);color:var(--cl)}
.e3-pill.mid{background:var(--cm-bg);color:var(--cm)}
.e3-pill.hi{background:var(--ch-bg);color:var(--ch)}
.e3-pill.cr{background:var(--cr-bg);color:var(--cr)}
.e3-pill.out{background:transparent;border:1px solid currentColor}
.e3-empty{font-size:12px;color:var(--txm);padding:14px 0;line-height:1.6}
.e3-sig{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:11px;padding:12px 0;border-bottom:1px solid var(--bd);align-items:start}
.e3-sig:last-child{border-bottom:0}

function gauge(score){
  const cls=rc(score);
  const col=`var(--${cls==='cr'?'cr':cls==='hi'?'ch':cls==='md'?'cm':'cl'})`;
  const r=22,cx=28,cy=28,perim=2*Math.PI*r,dash=(score/100)*perim;
  return`<svg width="56" height="56"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="4.5"/>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="4.5" stroke-dasharray="${dash.toFixed(1)} ${perim.toFixed(1)}" stroke-dashoffset="${(perim*.25).toFixed(1)}" stroke-linecap="round"/>
<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${col}" font-family="system-ui,sans-serif">${score}</text></svg>`;
}

function sparkline(data,w,h,color){
  const max=Math.max(...data),min=Math.min(...data),range=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/range)*(h-4)-2}`).join(' ');
  const id='sg'+uid();
  return`<svg width="${w}" height="${h}" style="display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
<polyline points="${pts} ${w},${h} 0,${h}" fill="url(#${id})" stroke="none"/>
<polyline points="${pts}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function donut(segs,W,H,label){
  const cx=W/2,cy=H/2,r=Math.min(W,H)/2-6,ri=r*.58;
  const total=segs.reduce((a,s)=>a+s.v,0);
  const gap=0.04;
  let angle=-Math.PI/2,paths='',legend='';
  segs.forEach((s,i)=>{
    const slice=(s.v/total)*(2*Math.PI-gap*segs.length);
    const a1=angle+gap/2,a2=a1+slice;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const x3=cx+ri*Math.cos(a2),y3=cy+ri*Math.sin(a2);
    const x4=cx+ri*Math.cos(a1),y4=cy+ri*Math.sin(a1);
    const lg=slice>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${ri},${ri} 0 ${lg},0 ${x4.toFixed(1)},${y4.toFixed(1)} Z" fill="${s.c}"/>`;
    angle+=slice+gap;
    legend+=`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:${s.c};display:inline-block;flex-shrink:0"></span>${s.l}</span>`;
  });
  return`<div style="display:flex;flex-direction:column;align-items:center">
<svg width="${W}" height="${H}">${paths}
<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--tx)" font-family="system-ui,sans-serif">${total}</text>
<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--tx2)" font-family="system-ui,sans-serif">${label}</text></svg>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px">${legend}</div></div>`;
}

function hbar(data,w,h,lw=140){
  const maxV=Math.max(...data.map(d=>d.v))||1;
  const rh=h/data.length;
  let s='';
  data.forEach((d,i)=>{
    const y=i*rh;
    const bw=Math.max(2,(d.v/maxV)*(w-lw-52));
    const bh=rh*.5,by=y+rh*.25;
    s+=`<text x="0" y="${y+rh*.65}" font-size="11" fill="var(--tx2)" font-family="system-ui,sans-serif">${d.l}</text>`;
    s+=`<rect x="${lw}" y="${by}" width="${bw}" height="${bh}" fill="${d.c||'var(--ac)'}" rx="3"/>`;
    s+=`<text x="${lw+bw+5}" y="${y+rh*.65}" font-size="10" fill="var(--tx)" font-weight="700" font-variant-numeric="tabular-nums" font-family="system-ui,sans-serif">${fmt(d.v)}</text>`;
  });
  return`<svg width="${w}" height="${h}" style="overflow:visible;display:block">${s}</svg>`;
}

function vbar(data,w,h){
  const pad=20,iW=w-pad*2,iH=h-28,maxV=Math.max(...data.map(d=>d.v))*1.08||1;
  const bw=Math.max(8,iW/data.length-6);
  let s='';
  // grid lines
  [.33,.66,1].forEach(f=>{const y=8+iH-(f*iH);s+=`<line x1="${pad}" y1="${y}" x2="${pad+iW}" y2="${y}" stroke="var(--bd)" stroke-width="1"/>`});
  data.forEach((d,i)=>{
    const bh=Math.max(2,(d.v/maxV)*iH);
    const x=pad+i*(iW/data.length)+(iW/data.length-bw)/2;
    const y=8+iH-bh;
    const id2='vg'+uid();
    s+=`<defs><linearGradient id="${id2}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${d.c||'var(--ac)'}" stop-opacity="1"/><stop offset="100%" stop-color="${d.c||'var(--ac)'}" stop-opacity=".5"/></linearGradient></defs>`;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="url(#${id2})" rx="4"/>`;
    s+=`<text x="${x+bw/2}" y="${8+iH+16}" text-anchor="middle" font-size="9" fill="var(--tx2)" font-family="system-ui,sans-serif">${d.l}</text>`;
    s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--tx)" font-weight="700" font-family="system-ui,sans-serif">${d.v}</text>`;
  });
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function linechart(datasets,labels,w,h){
  const pl=32,pr=8,pt=10,pb=22,iW=w-pl-pr,iH=h-pt-pb;
  const allV=datasets.flatMap(d=>d.data);
  const maxV=Math.max(...allV)*1.12||1;
  const n=labels.length;
  const px=i=>pl+(i/(n-1))*iW;
  const py=v=>pt+iH-(v/maxV)*iH;
  let s='';
  // grid
  [.25,.5,.75,1].forEach(f=>{
    const y=py(maxV*f);
    s+=`<line x1="${pl}" y1="${y}" x2="${pl+iW}" y2="${y}" stroke="var(--bd)" stroke-width="1" stroke-dasharray="3,4"/>`;
    s+=`<text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="8" fill="var(--txm)" font-family="system-ui,sans-serif">${Math.round(maxV*f)}</text>`;
  });
  datasets.forEach(ds=>{
    const pts=ds.data.map((v,i)=>({x:px(i),y:py(v)}));
    const area=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+` L${px(n-1).toFixed(1)},${(pt+iH).toFixed(1)} L${px(0).toFixed(1)},${(pt+iH).toFixed(1)} Z`;
    const line=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const gid='lg'+uid();
    s+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${ds.c}" stop-opacity=".2"/><stop offset="100%" stop-color="${ds.c}" stop-opacity="0"/></linearGradient></defs>`;
    s+=`<path d="${area}" fill="url(#${gid})"/>`;
    s+=`<path d="${line}" stroke="${ds.c}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
    const last=pts[pts.length-1];
    s+=`<circle cx="${last.x}" cy="${last.y}" r="3.5" fill="${ds.c}"/>`;
  });
  labels.forEach((l,i)=>{s+=`<text x="${px(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="8.5" fill="var(--txm)" font-family="system-ui,sans-serif">${l}</text>`});
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function heatmap(rows,cols,data,w,h){
  const cw=Math.floor((w-60)/cols),ch=Math.floor((h-22)/rows);
  const maxV=Math.max(...data.flat())||1;
  let s='';
  cols>0&&[...Array(cols)].forEach((_,j)=>{s+=`<text x="${60+j*cw+cw/2}" y="14" text-anchor="middle" font-size="8" fill="var(--txm)" font-family="system-ui,sans-serif">${MO[j]?.m||j}</text>`});
  data.forEach((row,i)=>{
    s+=`<text x="55" y="${22+i*ch+ch/2+4}" text-anchor="end" font-size="9" fill="var(--tx2)" font-family="system-ui,sans-serif">${rows[i]}</text>`;
    row.forEach((v,j)=>{
      const a=v/maxV;
      s+=`<rect x="${60+j*cw+1}" y="${22+i*ch+1}" width="${cw-2}" height="${ch-2}" fill="var(--ac)" opacity="${a*.85+.05}" rx="2"/>`;
      if(v>0)s+=`<text x="${60+j*cw+cw/2}" y="${22+i*ch+ch/2+4}" text-anchor="middle" font-size="8.5" fill="var(--tx)" font-weight="${v>maxV*.5?'700':'400'}" font-family="system-ui,sans-serif">${v}</text>`;
    });
  });
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function buildMap(layer){
  const getVal=(r,l)=>{
    const f=REG.find(x=>x.id===r.id);
    if(!f)return 0;
    return l==='risk'?f.risk:l==='del'?f.cr:l==='so'?f.so:l==='sp'?Math.round(f.sp/1e3):f.osfl;
  };
  const vals=CGEO.map(r=>getVal(r,layer));
  const maxV=Math.max(...vals)||1;
  let s='';
  CGEO.forEach((r,i)=>{
    const nxt=CGEO[i+1]||{xl:r.xl,xr:r.xr};
    const v=vals[i],frac=v/maxV;
    const intensity=layer==='risk'?v:frac*100;
    const col=intensity>=75?'var(--cr)':intensity>=55?'var(--ch)':intensity>=35?'var(--cm)':'var(--cl)';
    const pts=`${r.xl},${r.y} ${r.xr},${r.y} ${nxt.xr},${r.y+r.h} ${nxt.xl},${r.y+r.h}`;
    const mx=(r.xl+r.xr)/2,my=r.y+r.h/2;
    s+=`<polygon points="${pts}" fill="${col}" stroke="var(--bg)" stroke-width="1.5" opacity=".88" data-id="${r.id}" style="cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.88" onclick="selectReg('${r.id}')"/>`;
    s+=`<text x="${mx}" y="${my+(r.h>30?4:3)}" text-anchor="middle" font-size="${r.h>40?9:8}" fill="rgba(255,255,255,.95)" font-weight="700" pointer-events="none" font-family="system-ui,sans-serif">${r.id}</text>`;
  });
  return`<svg id="mapa-svg" width="185" height="782" style="flex-shrink:0;border-radius:8px">${s}</svg>`;
}

function dvOf(body){ let s = 0, m = 2; for (let i = body.length - 1; i >= 0; i--){ s += (+body[i]) * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (s % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r); }
function parseRut(x){
  const c = String(x || '').toUpperCase().replace(/[^0-9K]/g, '');
  if (c.length < 2) return null;
  const body = c.slice(0, -1), d = c.slice(-1);
  if (!/^\d+$/.test(body)) return null;
  return {body, d, valid: dvOf(body) === d, key: body + '-' + d,
          fmt: body.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + d};
}
function normName(s){
  return String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function parseCsv(text){
  const rows = []; let i = 0, field = '', row = [], quoted = false;
  while (i < text.length){
    const ch = text[i];
    if (quoted){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i += 2; continue; } quoted = false; i++; continue; }
      field += ch; i++; continue;
    }
    if (ch === '"'){ quoted = true; i++; continue; }
    if (ch === ','){ row.push(field); field = ''; i++; continue; }
    if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    field += ch; i++;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, j) => [h.trim(), r[j]])));
}

async function load(key){

                 cache[key] = v; state[key].s = 'ok'; state[key].bytes = t.length; return v; })
    .catch(e => { cache[key] = null; state[key].s = 'error'; state[key].err = e.message; return null; });
  state[key].p = p;
  return p;
}

function build(rut){

  if (enr){
    d.obs.sii = true;
    d.alias.push([enr.legal_name, 'Radar SII', 'legal_name']);
    (enr.marks || []).forEach(m => {
      d.signals.push({code:m.signal_type, src:'sii', period:String(m.year), sev:m.severity, conf:'—',
        why:m.why, checks:'Regla del catálogo Radar SII. Contextualizar por industria y modelo operativo antes de interpretar.',

      const y = parseInt(m.year, 10);
      if (y) d.events.push({src:'sii', t:y + .5, k:m.signal_type, d:m.why, w:'signal'});
    });
    if (enr.start_date){
      const y = parseInt(String(enr.start_date).slice(0, 4), 10);
      if (y) d.events.push({src:'sii', t:y + .1, k:'Inicio de actividades', d:'Fecha de inicio publicada por SII: ' + enr.start_date, w:'life'});
    }
    if (enr.termination_date){
      const y = parseInt(String(enr.termination_date).slice(0, 4), 10);
      if (y) d.events.push({src:'sii', t:y + .5, k:'Término de giro', d:'Término registrado: ' + enr.termination_date, w:'life'});
    }
  }

  // ---- Perímetro UAF: registro + screening ACTECO
  const uafD = cache.uaf;
  const uafList = uafD && uafD.entities ? uafD.entities : null;
  const uafTotal = uafD && uafD.kpis ? uafD.kpis.entities : null;
  d.uaf = {truncated: !!(uafList && uafTotal && uafList.length < uafTotal),
           shown: uafList ? uafList.length : 0, total: uafTotal,
           asOf: uafD && uafD.kpis ? uafD.kpis.registered_total_as_of : null,
           hit: uafList ? uafList.find(e => e.rut === key) || null : null};
  if (d.uaf.hit){
    d.obs.uaf = true;
    d.alias.push([d.uaf.hit.name, 'Radar UAF', 'name (registro)']);
    d.events.push({src:'uaf', t:2026.5, k:'Inscrita en el registro UAF', d:'Aparece en el registro de entidades reportantes. Tipo: ' + d.uaf.hit.entity_type, w:'perim'});
  }
  d.screen = ((enr && enr.acteco) || []).map(a => {
    const code = String(a.codigo || '').padStart(6, '0');
    const s = SCREEN[code];
    return {code, glosa:a.glosa || '', estado:a.estado || '', cls:s ? s[0] : null, sector:s ? s[1] : null, use:s ? s[2] : null};
  });
  const trig = d.screen.filter(s => s.cls === 'A' || s.cls === 'A_REGISTRO');
  d.uafCandidate = trig.length > 0;   // candidatura de screening ≠ identidad resuelta
  if (trig.length){
    d.signals.push({code:'UAF_SCREENING_' + trig[0].cls, src:'uaf', period:'CURRENT', sev:d.uaf.hit ? 'LOW' : 'HIGH', conf:'MEDIUM', typ:'per',
      why:trig.length + ' ACTECO vigente(s) de clase gatillante compatibles con ' + trig.map(t => t.sector).join(' · ') + (d.uaf.hit ? ', y la entidad figura en el registro publicado.' : ', sin coincidencia en el registro publicado.'),

      origin:SCREEN_SRC});

  // ---- Sanciones
  const sanEnt = cache.sanEnt ? cache.sanEnt.find(e => e.rut === key) : null;

    d.obs.san = true;
    if (sanEnt.nombre_uaf) d.alias.push([sanEnt.nombre_uaf, 'Radar Sanciones', 'sujeto individualizado']);
  }
  d.sanEvents = cache.sanEvt ? cache.sanEvt.filter(e => e.rut_fuente === key) : null;
  (d.sanEvents || []).forEach(e => {
    d.obs.san = true;
    const y = parseFloat(String(e.fecha).slice(0, 4)) + (parseInt(String(e.fecha).slice(5, 7), 10) - 1) / 12;
    d.events.push({src:'san', t:y, k:e.supervisor + ' · ' + (e.tipo_evento || 'Evento'), d:e.resumen || e.categoria, w:'adv', url:e.resolution_url || e.source_url, raw:e});
    d.signals.push({code:e.laft_directo ? 'SAN_ALA_CFT_DIRECTO' : 'SAN_EVENTO_ADVERSO', src:'san', period:e.fecha, sev:e.laft_directo ? 'HIGH' : 'MEDIUM', conf:'HIGH', typ:'adv',
      why:clip(e.resumen, 260), checks:'Verificar firmeza y alcance de la resolución. Una sanción prudencial no acredita LA/FT.',
      url:e.resolution_url || e.source_url, origin:'Radar Sanciones · ' + e.supervisor});

  d.preSignals = qd ? qd.queue.filter(s => String(s.provider_id || '').endsWith(key) || String(s.recipient_id || '').endsWith(key)) : null;
  (d.preSignals || []).forEach(s => {
    d.obs.pre = true;
    let checks = s.recommended_checks;
    try { const arr = JSON.parse(checks); if (Array.isArray(arr)) checks = arr.join(' · '); } catch(_){}
    d.signals.push({code:s.signal_type, src:'pre', period:s.periodo + (s.mes ? '-' + String(s.mes).padStart(2, '0') : ''),
      sev:s.severity, conf:s.confidence, typ:'pub', why:s.why_flagged, checks, tier:s.priority_tier,
      score:s.investigation_priority_score, expl:s.priority_explanation, org:s.organization_name,
      amount:s.transaction_amount, oc:s.has_purchase_order, origin:'Presupuesto Abierto', raw:s});
    const y = s.periodo + (s.mes ? (s.mes - 1) / 12 : .5);
    d.events.push({src:'pre', t:y, k:s.signal_type, d:s.why_flagged, w:'signal'});
    if (s.provider_or_recipient_name) d.alias.push([s.provider_or_recipient_name, 'Presupuesto Abierto', 'razón social del devengado']);

  d.orgs = [...new Map((d.preSignals || []).filter(s => s.organization_name)
    .map(s => [s.organization_id, {id:s.organization_id, name:s.organization_name, n:0, amount:0}])).values()];
  (d.preSignals || []).forEach(s => { const o = d.orgs.find(x => x.id === s.organization_id); if (o){ o.n++; o.amount += (s.transaction_amount || 0); } });

    names.forEach(nm => pool.forEach(p => {

    });
  }
  if (d.cgr.cands.length || d.cgr.orgHits.length) d.obs.cgr = 'cand';
  d.cgr.orgHits.forEach(h => {
    d.signals.push({code:'CGR_ORGANISMO_CONTRAPARTE', src:'cgr', period:'—', sev:'MEDIUM', conf:'LOW', typ:'adv',
      why:`El organismo pagador «${h.org.name}» registra ${h.cgr.findings} hallazgos CGR (score AML máximo ${h.cgr.aml_relevance_score}).`,
      checks:'El hallazgo es del organismo, no de esta entidad. Enlace por nombre normalizado, estado CANDIDATE: no atribuir.',
      origin:'Radar CGR · dashboard'});
  });

  // ---- OSFL
  if (cache.osfl){
    const hit = cache.osfl.find(r => (r.rut || '').toUpperCase() === key);
    d.osfl = hit || false;
    if (hit){ d.obs.osl = true; d.events.push({src:'osl', t:2026.4, k:'Inscrita como donataria (Ley 21.440)', d:'Estado: ' + hit.registry_status, w:'perim', url:hit.source_url}); }
  } else d.osfl = null;

  // ---- Delictual: contexto territorial, sin publicación en Pages
  d.del = null;

  // ---- alias / conflictos
  d.alias = [...new Map(d.alias.map(a => [a[0] + '|' + a[1], a])).values()];
  const distinct = new Set(d.alias.map(a => normName(a[0])));
  if (distinct.size > 1) d.conflicts.push({t:'Denominaciones distintas entre fuentes',
    d:`Las fuentes individualizan a esta entidad con ${distinct.size} formas distintas del nombre. La identidad se sostiene en el RUT, no en la razón social; cualquier cruce por nombre hereda esa ambigüedad.`});
  if (d.cgr.cands.length) d.conflicts.push({t:'Coincidencia CGR por nombre, sin RUT en la fuente',
    d:`Radar CGR no publica RUT en ninguno de sus ${(cache.cgr ? (cache.cgr.providers || []).length + (cache.cgr.organizations || []).length : 0)} registros de entidad. La coincidencia queda CANDIDATE y no se computa como convergencia.`});
  if (!rut.valid) d.conflicts.push({t:'Dígito verificador inválido',
    d:'El RUT consultado no supera la validación de dígito verificador. La clave global ENT-RUT-{RUT} exige RUT válido: sin él, ninguna fuente puede resolver identidad.'});

  // ---- convergencia: sólo fuentes con identidad resuelta por RUT
  d.converge = ['sii','uaf','pre','san','osl'].filter(k => d.obs[k] === true).length;
  d.convTotal = ORDER.length;

  // ---- prioridad: la declarada por Presupuesto, nunca inventada
  const tiers = (d.preSignals || []).map(s => s.priority_tier).filter(Boolean);
  d.tier = tiers.includes('P1') ? 'P1' : tiers.includes('P2') ? 'P2' : tiers.includes('P3') ? 'P3' : null;
  d.tierScores = (d.preSignals || []).map(s => s.investigation_priority_score);

  // ---- pares (calculado sobre el universo publicado, no inventado)
  d.peers = peerGroup(key, enr);

  // ---- vacíos declarados
  d.gaps = gaps(d);
  return d;
}

function pct(arr, v){ const s = arr.slice().sort((a, b) => a - b); let i = 0; while (i < s.length && s[i] < v) i++; return Math.round(i / Math.max(1, s.length - 1) * 100); }

function peerGroup(key, enr){
  const all = cache.enrich && cache.enrich.entities ? Object.values(cache.enrich.entities) : null;
  if (!all || !enr) return {ok:false, reason:'sin_enriquecimiento'};
  const levels = [
    {label:'misma actividad principal · ' + (enr.main_activity || '—'), rows:all.filter(e => e.main_activity && e.main_activity === enr.main_activity)},
    {label:'mismo subtipo tributario · ' + (enr.taxpayer_subtype || '—'), rows:all.filter(e => e.taxpayer_subtype && e.taxpayer_subtype === enr.taxpayer_subtype)},
    {label:'universo enriquecido completo', rows:all},
  ];
  const chosen = levels.find(l => l.rows.length >= 20) || levels[levels.length - 1];
  const band = chosen.rows.map(e => +e.sales_band_code).filter(v => v > 0);
  const wk = chosen.rows.map(e => +e.workers).filter(v => v >= 0 && !isNaN(v));
  const yr = e => { const y = parseInt(String(e.start_date || '').slice(0, 4), 10); return y ? 2026 - y : null; };
  const ages = chosen.rows.map(yr).filter(v => v != null);
  const myAge = yr(enr);
  const wps = chosen.rows.filter(e => +e.workers > 0).map(e => (+e.sales_band_code) / (+e.workers));
  const myWps = (+enr.workers > 0) ? (+enr.sales_band_code) / (+enr.workers) : null;
  const m = [
    {k:'Tramo de ventas SII', p:pct(band, +enr.sales_band_code), unit:enr.sales_band_label || ''},
    {k:'Trabajadores informados', p:pct(wk, +enr.workers), unit:N(enr.workers || 0) + ' dependientes'},
  ];
  if (myAge != null) m.push({k:'Antigüedad de la sociedad', p:pct(ages, myAge), unit:myAge + ' años desde el inicio'});
  if (myWps != null) m.push({k:'Tramo por trabajador', p:pct(wps, myWps), unit:'proxy de intensidad de dotación'});
  return {ok:true, level:chosen.label, n:chosen.rows.length, sufficient:chosen.rows.length >= 20,
    fellBack:chosen !== levels[0], universe:all.length, metrics:m};
}

function gaps(d){
  const g = [];
  const st = k => state[k].s;
  if (d.uaf.truncated) g.push({t:'Registro UAF publicado de forma truncada', s:'PARCIAL',
    d:`El dashboard publica ${N(d.uaf.shown)} de ${N(d.uaf.total)} entidades del registro (corte ${d.uaf.asOf || 's/f'}). No encontrar el RUT aquí <b>no significa</b> que la entidad no esté inscrita: significa que no es evaluable con lo publicado.`});
  if (!d.cgr.hasRut) g.push({t:'Radar CGR no publica RUT', s:'SIN_IDENTIDAD',
    d:'Ninguno de los registros de entidad de CGR trae RUT. Todo cruce es por nombre normalizado y permanece CANDIDATE, por lo que no suma convergencia ni se atribuye a esta entidad.'});
  if (d.queueMeta) g.push({t:'Cola de Presupuesto publicada parcialmente', s:'PARCIAL',
    d:`Se publican las ${N(d.queueMeta.published)} señales de mayor prioridad de un total de ${N(d.queueMeta.total)}. La ausencia de señales para un RUT no implica que no existan en la serie completa.`});
  g.push({t:'Grafo de propiedad no publicado', s:'NO_DISPONIBLE',
    d:`Radar SII declara ${cache.siiDash && cache.siiDash.kpis ? N(cache.siiDash.kpis.ownership_edges) : '≈2 millones de'} aristas de propiedad, pero el Parquet vive en artefactos de GitHub Actions y no en Pages. Sin él no hay socios, control ni cadena de beneficiario final: la red de esta vista se limita a los organismos pagadores.`});
  g.push({t:'Contexto territorial sin publicación en Pages', s:'NO_DISPONIBLE',
    d:'Radar Delictual materializa sus salidas en la rama <code>radar-data</code>, no en <code>docs/</code>. El carril territorial queda vacío por indisponibilidad de la fuente, no por ausencia de contexto.'});
  g.push({t:'Benchmark de pares de Context Hub no disponible', s:'NO_DISPONIBLE',
    d:'Context Hub no publica <code>economic_peer_context_v1</code> en Pages. La comparación de esta vista se calcula sobre el universo enriquecido publicado, que es mucho más pequeño y no equivale al grupo de pares canónico.'});
  if (st('sanEvt') === 'ok' && d.sanEvents && !d.sanEvents.length) g.push({t:'Cobertura parcial de supervisores', s:'PARCIAL',
    d:'La carga de SP, SUSESO y SCJ es parcial desde 2020 y el backfill sigue abierto. La ausencia de eventos adversos no equivale a inexistencia.'});
  Object.keys(FEEDS).forEach(k => { if (state[k].s === 'error') g.push({t:'Fuente no disponible: ' + FEEDS[k].label, s:'FALLO',
    d:`No se pudo leer <code>${E(state[k].url)}</code> (${E(state[k].err || 'error')}). Se conserva el último estado conocido y no se interpreta como cero.`}); });
  return g;
}

const TYP = [
  {id:'str', n:'Estructural',  short:'Estructural',   d:'Giros, domicilios, ciclo de vida'},
  {id:'eco', n:'Económica',    short:'Económica',     d:'Tramo de ventas, dotación, patrimonio'},
  {id:'per', n:'Perímetro',    short:'Perímetro',     d:'Condición de sujeto obligado'},
  {id:'pub', n:'Contratación', short:'Contratación',  d:'Flujos de gasto público'},
  {id:'adv', n:'Adversa',      short:'Adversa',       d:'Sanciones y hallazgos'},
];
function matrix(d){
  const m = {};
  TYP.forEach(t => { m[t.id] = {}; ORDER.forEach(s => m[t.id][s] = 0); });
  d.signals.forEach(s => { if (m[s.typ]) m[s.typ][s.src] = (m[s.typ][s.src] || 0) + 1; });
  return m;
}

let tipEl;
function tipInit(){ if (!tipEl){ tipEl = document.createElement('div'); tipEl.id = 'e3tip'; document.body.appendChild(tipEl); } }
function bindTip(node, html){
  tipInit();
  node.addEventListener('mouseenter', e => { tipEl.innerHTML = html; tipEl.style.opacity = '1'; moveTip(e); });
  node.addEventListener('mousemove', moveTip);
  node.addEventListener('mouseleave', () => { tipEl.style.opacity = '0'; });
}
function moveTip(e){
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}

const RAMP_L = ['#cde2fb','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95'];
const RAMP_D = ['#0d366b','#104281','#184f95','#1c5cab','#256abf','#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef'];
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); if (t === 'dark') return true; if (t === 'light') return false; return matchMedia('(prefers-color-scheme: dark)').matches; }
const ramp = f => { const r = isDark() ? RAMP_D : RAMP_L; return r[Math.max(0, Math.min(9, Math.round(f * 9)))]; };

let TLFULL = false;
function timelineChart(W, d){
  const all = d.events.slice().sort((a, b) => a.t - b.t);
  if (!all.length) return `<div class="e3-empty">No hay eventos fechados para esta entidad en las fuentes disponibles. Revise los vacíos declarados antes de leerlo como ausencia de hechos.</div>`;
  const fullA = Math.floor(Math.min(...all.map(e => e.t)) - .4);
  const fullB = Math.ceil(Math.max(...all.map(e => e.t)) + .6);
  const wide = (fullB - fullA) > 14;
  const t0 = (wide && !TLFULL) ? fullB - 12 : fullA;
  const t1 = fullB;
  const ev = all.filter(e => e.t >= t0);
  const hidden = all.length - ev.length;
  const lanes = ORDER.filter(s => ev.some(e => e.src === s));
  const laneH = 32, pl = 116, pr = 16, pt = 24, iW = W - pl - pr;
  const H = pt + lanes.length * laneH + 34;
  const px = t => pl + ((t - t0) / (t1 - t0)) * iW;
  let s = '';
  const step = (t1 - t0) > 14 ? 2 : 1;
  for (let y = t0; y <= t1; y += step){
    s += `<line x1="${px(y).toFixed(1)}" y1="${pt - 6}" x2="${px(y).toFixed(1)}" y2="${pt + lanes.length * laneH}" stroke="var(--bd)" stroke-width="1"/>`;
    s += `<text x="${px(y).toFixed(1)}" y="${pt - 12}" text-anchor="middle" font-size="10" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">${y}</text>`;
  }
  // ventanas de convergencia reales
  const wins = [];
  for (let y = t0; y <= t1; y += .5){
    const set = new Set(ev.filter(e => e.t >= y && e.t < y + 1).map(e => e.src));
    if (set.size >= 3) wins.push({a:y, b:y + 1, n:set.size});
  }
  wins.forEach(w => { s += `<rect x="${px(w.a).toFixed(1)}" y="${pt - 6}" width="${(px(w.b) - px(w.a)).toFixed(1)}" height="${lanes.length * laneH + 6}" fill="rgba(59,130,246,.10)"/>`; });
  lanes.forEach((sid, i) => {
    const y = pt + i * laneH + laneH / 2;
    const cnt = ev.filter(e => e.src === sid).length;
    s += `<line x1="${pl}" y1="${y}" x2="${pl + iW}" y2="${y}" stroke="var(--bd)" stroke-width="1"/>`;
    s += `<rect x="0" y="${y - 8}" width="3" height="16" rx="1.5" fill="${svar(sid)}"/>`;
    s += `<text x="10" y="${y - 1}" font-size="11" font-weight="700" fill="var(--tx)">${E(RADAR[sid].name)}</text>`;
    s += `<text x="10" y="${y + 10}" font-size="9.5" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">${cnt} evento${cnt === 1 ? '' : 's'}</text>`;
  });
  // agrupa marcas que se solaparían en el mismo carril
  const clusters = [];
  lanes.forEach(sid => {
    let cur = null;
    ev.filter(e => e.src === sid).forEach(e => {
      const x = px(e.t);
      if (cur && Math.abs(x - cur.x) < 11) cur.items.push(e);
      else { cur = {src:sid, x, items:[e]}; clusters.push(cur); }
    });
  });
  clusters.forEach((c, i) => {
    const li = lanes.indexOf(c.src);
    const y = pt + li * laneH + laneH / 2, x = c.x;
    const adv = c.items.some(e => e.w === 'adv');
    const life = !adv && c.items.every(e => e.w === 'life' || e.w === 'perim');
    const r = (adv ? 6 : 5) + (c.items.length > 1 ? 2 : 0);
    if (adv) s += `<path d="M${x.toFixed(1)},${(y-r).toFixed(1)} L${(x+r).toFixed(1)},${y.toFixed(1)} L${x.toFixed(1)},${(y+r).toFixed(1)} L${(x-r).toFixed(1)},${y.toFixed(1)} Z" fill="${svar(c.src)}" stroke="var(--s1)" stroke-width="1.6" class="e3ev" data-i="${i}" style="cursor:pointer"/>`;
    else if (life) s += `<rect x="${(x-r+1).toFixed(1)}" y="${(y-r+1).toFixed(1)}" width="${(r*2-2)}" height="${(r*2-2)}" rx="1.5" fill="none" stroke="${svar(c.src)}" stroke-width="2" class="e3ev" data-i="${i}" style="cursor:pointer"/>`;
    else s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${svar(c.src)}" stroke="var(--s1)" stroke-width="1.6" class="e3ev" data-i="${i}" style="cursor:pointer"/>`;
    if (c.items.length > 1) s += `<text x="${x.toFixed(1)}" y="${(y + 3.2).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="800" fill="var(--s1)" pointer-events="none">${c.items.length}</text>`;
  });
  wins.forEach(w => { s += `<text x="${(px(w.a) + 3).toFixed(1)}" y="${pt + lanes.length * laneH + 16}" font-size="10" font-weight="700" fill="var(--ac)">${w.n} fuentes</text>`; });
  CH._tlCl = clusters;
  return `${wide ? `<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:11px;color:var(--txm)">
      <button class="btn" id="e3tlz" style="padding:3px 10px;font-size:11px">${TLFULL ? 'Ver últimos 12 años' : `Ver rango completo (${fullA}–${fullB})`}</button>
      ${hidden ? `<span>${hidden} evento(s) anterior(es) a ${t0} fuera de la ventana</span>` : '<span>ventana completa</span>'}</div>` : ''}
  <div style="overflow-x:auto"><svg id="e3tl" viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img" aria-label="Cronología multi-fuente">${s}</svg></div>
  <div class="e3-legend">
    <span class="e3-lg"><span style="width:10px;height:10px;border-radius:50%;background:var(--txm);display:inline-block"></span>señal derivada</span>
    <span class="e3-lg"><span style="width:9px;height:9px;border:2px solid var(--txm);display:inline-block;border-radius:2px"></span>hecho registral</span>
    <span class="e3-lg"><span style="width:10px;height:10px;background:var(--txm);display:inline-block;transform:rotate(45deg)"></span>evento adverso</span>
    <span class="e3-lg"><span class="e3-sw" style="background:rgba(59,130,246,.16)"></span>≥3 fuentes en 12 meses</span>
  </div>`;
}
function bindTimeline(){
  const z = q('#e3tlz');
  if (z) z.addEventListener('click', () => { TLFULL = !TLFULL; mountCharts(q('#e3root')); });
  document.querySelectorAll('#e3tl .e3ev').forEach(n => {
    const c = CH._tlCl[+n.dataset.i];
    const head = c.items.length > 1 ? c.items.length + ' eventos' : c.items[0].k;
    bindTip(n, `<b>${E(head)}</b><span class="k">${E(RADAR[c.src].name)} · ${String(c.items[0].t).slice(0, 4)}</span><br>` +
      c.items.slice(0, 4).map(e => (c.items.length > 1 ? '· <b>' + E(e.k) + '</b> — ' : '') + E(clip(e.d, 150))).join('<br>') +
      (c.items.length > 4 ? `<br><span class="k">y ${c.items.length - 4} más</span>` : ''));
    n.addEventListener('click', () => evidenceForEvent(c.items[0]));
  });
}

function matrixChart(W, d){
  const m = matrix(d);
  const rowH = 32, labelW = 104, headH = 96, rightPad = 84;
  const cell = Math.max(28, (W - labelW - rightPad) / ORDER.length);
  const H = headH + TYP.length * rowH + 8;
  const maxV = Math.max(1, ...TYP.flatMap(t => ORDER.map(s => m[t.id][s])));
  let s = '';
  ORDER.forEach((sid, j) => {
    const x = labelW + j * cell + cell / 2;
    s += `<g transform="translate(${x},${headH - 12}) rotate(-90)"><text x="0" y="4" font-size="10" font-weight="600" fill="var(--tx2)">${E(RADAR[sid].name)}</text></g>`;
    s += `<rect x="${labelW + j * cell + 2}" y="${headH - 6}" width="${cell - 4}" height="2.5" rx="1" fill="${svar(sid)}"/>`;
  });
  TYP.forEach((t, i) => {
    const y = headH + i * rowH;
    s += `<text x="0" y="${y + rowH / 2 + 4}" font-size="11" font-weight="600" fill="var(--tx)">${E(t.short)}</text>`;
    let n = 0;
    ORDER.forEach((sid, j) => {
      const v = m[t.id][sid]; if (v) n++;
      const x = labelW + j * cell + 2;
      const f = v / maxV;
      s += `<rect x="${x}" y="${y + 3}" width="${cell - 4}" height="${rowH - 8}" rx="3" fill="${v ? ramp(.25 + f * .75) : 'var(--s2)'}" class="e3mc" data-t="${E(t.n)}" data-s="${E(RADAR[sid].name)}" data-v="${v}"/>`;
      if (v) s += `<text x="${(x + (cell - 4) / 2).toFixed(1)}" y="${y + rowH / 2 + 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${f > .5 ? '#fff' : (isDark() ? '#dbeafe' : '#0d366b')}" pointer-events="none">${v}</text>`;
    });
    const lbl = n >= 2 ? 'corrobora' : n === 1 ? 'fuente única' : '—';
    s += `<text x="${labelW + ORDER.length * cell + 8}" y="${y + rowH / 2 + 4}" font-size="9.5" font-weight="700" fill="${n >= 2 ? 'var(--ac)' : 'var(--txm)'}">${lbl}</text>`;
  });
  return `<div style="overflow-x:auto"><svg id="e3mx" viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img" aria-label="Matriz de convergencia">${s}</svg></div>`;
}
function bindMatrix(){
  document.querySelectorAll('#e3mx .e3mc').forEach(n => bindTip(n, `<b>${n.dataset.t}</b><span class="k">${n.dataset.s}</span><br>${n.dataset.v === '0' ? 'sin evidencia en esta fuente — no equivale a ausencia del hecho' : n.dataset.v + ' evidencia(s)'}`));
}

function peerChart(W, d){
  const p = d.peers;
  if (!p || !p.ok) return `<div class="e3-empty">No hay datos de enriquecimiento para construir un grupo de pares.</div>`;
  const rowH = 44, H = p.metrics.length * rowH + 26, mid = W * .5;
  let s = `<rect x="${W * .25}" y="14" width="${W * .5}" height="${H - 44}" fill="var(--s2)"/>`;
  s += `<line x1="${mid}" y1="14" x2="${mid}" y2="${H - 30}" stroke="var(--bds)" stroke-width="1"/>`;
  p.metrics.forEach((m, i) => {
    const y = 26 + i * rowH, x = (m.p / 100) * W;
    const extreme = m.p >= 90 || m.p <= 10;
    const col = extreme ? 'var(--cr)' : 'var(--ac)';
    s += `<text x="0" y="${y - 6}" font-size="11" font-weight="700" fill="var(--tx)">${E(m.k)}</text>`;
    s += `<text x="${W}" y="${y - 6}" text-anchor="end" font-size="10" fill="var(--txm)">${E(m.unit)}</text>`;
    s += `<line x1="${mid}" y1="${y + 6}" x2="${x.toFixed(1)}" y2="${y + 6}" stroke="${col}" stroke-width="2" stroke-linecap="round" opacity=".5"/>`;
    s += `<circle cx="${x.toFixed(1)}" cy="${y + 6}" r="5" fill="${col}" stroke="var(--s1)" stroke-width="2"/>`;
    s += `<text x="${(x + (m.p >= 50 ? -10 : 10)).toFixed(1)}" y="${y + 10}" text-anchor="${m.p >= 50 ? 'end' : 'start'}" font-size="10.5" font-weight="700" fill="var(--tx2)" font-family="'SF Mono',Menlo,monospace">p${m.p}</text>`;
  });
  s += `<text x="0" y="${H - 8}" font-size="9.5" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">p0</text>`;
  s += `<text x="${mid}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">mediana</text>`;
  s += `<text x="${W}" y="${H - 8}" text-anchor="end" font-size="9.5" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">p100</text>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img" aria-label="Posición frente a pares">${s}</svg></div>`;
}

function netChart(W, d){
  if (!d.orgs.length) return `<div class="e3-empty">No hay organismos pagadores publicados para esta entidad. Sin el Parquet de propiedad del Radar SII, esta vista no puede mostrar socios ni control.</div>`;
  const orgs = d.orgs.slice(0, 8);
  const H = Math.max(220, 70 + orgs.length * 44);
  const cx = 118, cy = H / 2, ox = Math.max(280, Math.min(W - 300, W * .48));
  let s = '';
  orgs.forEach((o, i) => {
    const y = 52 + i * ((H - 74) / Math.max(1, orgs.length - 1 || 1));
    const yy = orgs.length === 1 ? cy : y;
    const adverse = d.cgr.orgHits.some(h => h.org.id === o.id);
    s += `<path d="M${cx + 46},${cy} C${(cx + ox) / 2},${cy} ${(cx + ox) / 2},${yy} ${ox - 12},${yy}" fill="none" stroke="${svar('pre')}" stroke-width="${Math.min(4, 1 + o.n / 12).toFixed(1)}" opacity=".7"/>`;
    s += `<circle cx="${ox}" cy="${yy}" r="13" fill="var(--s3)" stroke="${adverse ? 'var(--cr)' : 'var(--bds)'}" stroke-width="${adverse ? 2.4 : 1.4}" class="e3nn" data-t="${E(o.name)}" data-n="${o.n}" data-a="${adverse ? 1 : 0}"/>`;
    s += `<text x="${ox + 20}" y="${yy - 1}" font-size="10.5" font-weight="700" fill="var(--tx)">${E(clip(o.name, 34))}</text>`;
    s += `<text x="${ox + 20}" y="${yy + 11}" font-size="9.5" fill="var(--txm)" font-family="'SF Mono',Menlo,monospace">${o.n} señal${o.n === 1 ? '' : 'es'}${adverse ? ' · CGR' : ''}</text>`;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="34" fill="var(--ac)" opacity=".92"/>`;
  s += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">FOCO</text>`;
  s += `<text x="${cx}" y="${cy + 52}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--tx)">${E(d.rut.fmt)}</text>`;
  return `<div style="overflow-x:auto"><svg id="e3net" viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img" aria-label="Organismos pagadores">${s}</svg></div>`;
}
function bindNet(){
  document.querySelectorAll('#e3net .e3nn').forEach(n => bindTip(n, `<b>${n.dataset.t}</b><span class="k">${n.dataset.n} señal(es) de gasto público con esta entidad</span>${n.dataset.a === '1' ? '<br>Registra hallazgos CGR propios (enlace por nombre, CANDIDATE)' : ''}`));
}

// ── render ─────────────────────────────────────────────────────────
let CUR = null, LENS = 'identidad', RUT = parseRut('94510000-1');

const LENSES = [
  {id:'identidad',  n:'01', t:'Identidad'},
  {id:'caracter',   n:'02', t:'Caracterización'},
  {id:'cronologia', n:'03', t:'Cronología'},
  {id:'red',        n:'04', t:'Red de exposición'},
  {id:'senales',    n:'05', t:'Señales y convergencia'},
  {id:'hipotesis',  n:'06', t:'Hipótesis y decisión'},
];

function render(){
  const ct = document.getElementById('ct');
  ct.innerHTML = `<div id="e3root">
    <div class="mh"><h1>Entity 360</h1><p>Expediente analítico por entidad · identidad, caracterización, cronología, red, señales e hipótesis, con la evidencia trazada a su fuente</p></div>
    <div class="e3-bar">
      <input class="e3-inp" id="e3q" value="${E(RUT.fmt)}" spellcheck="false" aria-label="RUT de la entidad">
      <button class="btn btn-p" id="e3go">Abrir expediente</button>
      <span class="e3-hint">RUT con dígito verificador · la identidad del ecosistema es <code style="font-family:'SF Mono',Menlo,monospace">ENT-RUT-{RUT}</code></span>
      <span class="e3-live" id="e3live"><i></i><span>conectando…</span></span>
    </div>
    <div id="e3body"></div>
  </div>`;
  q('#e3go').addEventListener('click', () => go(q('#e3q').value));
  q('#e3q').addEventListener('keydown', e => { if (e.key === 'Enter') go(q('#e3q').value); });
  q('#e3body').innerHTML = skeleton();
  boot();
}

function skeleton(){
  return `<div class="card">${[92, 60, 74, 40].map(w => `<div class="e3-skel" style="width:${w}%;margin-bottom:10px"></div>`).join('')}
    <div style="font-size:11.5px;color:var(--txm);margin-top:6px">Leyendo las fuentes publicadas por cada radar…</div></div>`;
}

function go(v){
  const r = parseRut(v);
  if (!r){ q('#e3body').innerHTML = `<div class="card"><div class="e3-empty">«${E(v)}» no es un RUT interpretable. Ingrese el RUT con su dígito verificador.</div></div>`; return; }
  RUT = r; LENS = 'identidad';
  q('#e3body').innerHTML = skeleton();
  boot();
}

async function boot(){
  await loadWave(1);
  liveStatus();
  CUR = build(RUT);
  paint();
  await loadWave(2);
  liveStatus();
  CUR = build(RUT);
  paint();
}

function liveStatus(){
  const el = q('#e3live'); if (!el) return;
  const ks = Object.keys(FEEDS);
  const ok = ks.filter(k => state[k].s === 'ok').length;
  const err = ks.filter(k => state[k].s === 'error').length;
  el.className = 'e3-live' + (err === ks.length ? ' err' : err ? ' off' : '');
  el.innerHTML = `<i></i><span>${ok}/${ks.length} fuentes en vivo${err ? ' · ' + err + ' sin respuesta' : ''}</span>`;
  el.title = ks.map(k => FEEDS[k].label + ': ' + state[k].s).join('\n');
}

function paint(){
  const d = CUR;
  q('#e3body').innerHTML = caratula(d) + tabs() + LENSES.map(l => `<section class="e3-pane" id="e3p-${l.id}" ${l.id === LENS ? '' : 'hidden'}></section>`).join('');
  q('#e3body').querySelectorAll('.e3-tab').forEach(b => b.addEventListener('click', () => { LENS = b.dataset.l; paint(); }));
  q('#e3body').querySelectorAll('.e3-src').forEach(b => b.addEventListener('click', () => sourceDrawer(b.dataset.s, d)));
  const pane = q('#e3p-' + LENS);
  ({identidad:lIdent, caracter:lCar, cronologia:lCron, red:lRed, senales:lSig, hipotesis:lHip}[LENS])(pane, d);
  mountCharts(q('#e3root'));
}

function tabs(){
  return `<div class="e3-tabs" role="tablist">${LENSES.map(l =>
    `<button class="e3-tab" role="tab" data-l="${l.id}" aria-selected="${l.id === LENS}"><span class="n">${l.n}</span><span class="t">${E(l.t)}</span></button>`).join('')}</div>`;
}

function resolution(d, sid){
  const st = k => state[k].s;
  if (sid === 'sii') return st('enrich') === 'error' ? ['SIN RESPUESTA', 'err'] : d.obs.sii ? ['RESUELTA', 'ok'] : ['SIN COINCIDENCIA', 'na'];
  if (sid === 'uaf') return st('uaf') === 'error' ? ['SIN RESPUESTA', 'err'] : d.uaf.hit ? ['RESUELTA', 'ok'] : d.uaf.truncated ? ['NO EVALUABLE', 'mid'] : ['SIN COINCIDENCIA', 'na'];
  if (sid === 'pre') return st('queue') === 'error' ? ['SIN RESPUESTA', 'err'] : st('queue') !== 'ok' ? ['CARGANDO', 'na'] : d.obs.pre ? ['RESUELTA', 'ok'] : ['SIN SEÑALES', 'na'];
  if (sid === 'san') return st('sanEnt') === 'error' ? ['SIN RESPUESTA', 'err'] : d.obs.san ? ['RESUELTA', 'ok'] : ['SIN COINCIDENCIA', 'na'];
  if (sid === 'cgr') return st('cgr') === 'error' ? ['SIN RESPUESTA', 'err'] : d.obs.cgr ? ['CANDIDATA', 'mid'] : cache.cgr ? ['SIN COINCIDENCIA', 'na'] : ['CARGANDO', 'na'];
  if (sid === 'osl') return st('osfl') === 'error' ? ['SIN RESPUESTA', 'err'] : st('osfl') !== 'ok' ? ['CARGANDO', 'na'] : d.osfl ? ['RESUELTA', 'ok'] : ['SIN COINCIDENCIA', 'na'];
  if (sid === 'del') return ['NO PUBLICADO', 'mid'];
  return ['—', 'na'];
}
const RESCOL = {ok:'var(--cl)', mid:'var(--cm)', err:'var(--cr)', na:'var(--txm)'};

function caratula(d){
  const name = (d.sii && d.sii.legal_name) || (d.san && d.san.nombre_uaf) || (d.uaf.hit && d.uaf.hit.name) || 'Entidad sin denominación en las fuentes disponibles';
  const roles = [];
  if (d.obs.pre) roles.push(['Proveedor o receptor de pagos del Estado', '']);
  if (d.uaf.hit) roles.push(['Sujeto obligado inscrito (UAF)', 'ok']);
  else if (d.screen.some(s => s.cls === 'A' || s.cls === 'A_REGISTRO')) roles.push(['Candidato de screening UAF', 'mid']);
  if (d.obs.san) roles.push([`Con evento adverso · ${d.san ? d.san.supervisores : ''}`, 'cr']);
  if (d.obs.cgr) roles.push(['Mención CGR candidata', 'mid']);
  if (d.osfl) roles.push(['Donataria Ley 21.440', '']);
  if (d.sii && d.sii.tax_status) roles.push([d.sii.tax_status === 'ACTIVE_AS_PUBLISHED' ? 'Contribuyente activo según publicación' : d.sii.tax_status, '']);

  const meta = [];
  meta.push(`<code style="font-family:'SF Mono',Menlo,monospace;color:var(--tx);font-weight:600">${E(d.rut.fmt)}</code>`);
  meta.push(d.rut.valid ? `<span class="e3-pill ok"><i></i>DV verificado</span>` : `<span class="e3-pill cr"><i></i>DV inválido</span>`);
  if (d.sii && d.sii.taxpayer_type) meta.push(`<span class="e3-sep"></span><span>${E(d.sii.taxpayer_subtype || d.sii.taxpayer_type)}</span>`);
  if (d.sii && d.sii.main_region) meta.push(`<span class="e3-sep"></span><span>${E(d.sii.main_region)}</span>`);
  if (d.sii && d.sii.start_date) meta.push(`<span class="e3-sep"></span><span>Inicio ${E(d.sii.start_date)}</span>`);
  meta.push(`<span class="e3-sep"></span><span style="font-family:'SF Mono',Menlo,monospace;color:var(--txm)">ENT-RUT-${E(d.rut.key)}</span>`);

  const tier = d.tier
    ? `<span class="e3-tier ${d.tier.toLowerCase()}">${d.tier}</span>`
    : `<span class="e3-tier na">sin señal publicada</span>`;
  const cov = Object.keys(FEEDS).filter(k => state[k].s === 'ok').length;
  const covPct = Math.round(cov / Object.keys(FEEDS).length * 100);

  return `<div class="e3-head">
    <div class="e3-htop">
      <div>
        <div class="e3-rk">Expediente analítico</div>
        <h2 class="e3-name" style="margin-top:5px">${E(name)}</h2>
        <div class="e3-meta">${meta.join('')}</div>
        <div class="e3-roles">${roles.map(r => `<span class="e3-pill ${r[1]}"><i></i>${E(r[0])}</span>`).join('') || '<span class="e3-pill"><i></i>Sin roles observados en las fuentes disponibles</span>'}</div>
      </div>
      <div class="e3-reads">
        <div class="e3-read"><span class="e3-rk">Convergencia</span>
          <div class="e3-rv">${d.converge}<small>/ ${d.convTotal}</small></div>
          <div class="e3-rc">fuentes independientes que resuelven esta entidad por RUT</div></div>
        <div class="e3-read"><span class="e3-rk">Prioridad de revisión</span>
          <div class="e3-rv" style="font-size:18px">${tier}</div>
          <div class="e3-rc">${d.tier ? 'declarada por Presupuesto Abierto · orden de trabajo, no probabilidad de delito' : 'no hay señal de esta entidad en la cola publicada'}</div></div>
        <div class="e3-read"><span class="e3-rk">Fuentes en línea</span>
          <div class="e3-rv">${covPct}<small>%</small></div>
          <div class="e3-rc">${cov} de ${Object.keys(FEEDS).length} archivos publicados respondieron</div></div>
      </div>
    </div>
    <div class="e3-ribbon">${ORDER.map(sid => {
      const [txt, cls] = resolution(d, sid);
      return `<button class="e3-src" data-s="${sid}" style="--e3c:${svar(sid)}">
        <span class="e3-sn">${E(RADAR[sid].name)}</span>
        <span class="e3-ss" style="color:${RESCOL[cls]}"><i class="e3-dot" style="background:${RESCOL[cls]}"></i>${txt}</span>
        <span class="e3-sa">${E(RADAR[sid].repo)}</span></button>`;
    }).join('')}</div>
  </div>`;
}

const lead = (h, p) => `<div class="e3-lead"><h2>${h}</h2><p>${p}</p></div>`;

// ── 01 identidad ───────────────────────────────────────────────────
function lIdent(el, d){
  const rows = ORDER.map(sid => {
    const [txt, cls] = resolution(d, sid);
    const feed = Object.keys(FEEDS).find(k => FEEDS[k].radar === sid);
    const method = sid === 'cgr' ? 'EXACT_NORMALIZED_NAME' : sid === 'del' ? 'CL-COM (territorio)' : 'RUT_EXACT';
    const conf = cls === 'ok' ? '1.00' : cls === 'mid' ? '0.00' : '—';
    return `<tr>
      <td><span class="e3-pill out" style="color:${svar(sid)}"><i></i>${E(RADAR[sid].name)}</span></td>
      <td><span style="color:${RESCOL[cls]};font-weight:700;font-size:11px">${txt}</span></td>
      <td style="font-family:'SF Mono',Menlo,monospace;font-size:11px;color:var(--tx2)">${method}</td>
      <td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${conf}</td>
      <td style="font-size:11px;color:var(--tx2)">${feed ? E(FEEDS[feed].label) : 'sin publicación en Pages'}</td>
      <td>${feed ? `<span class="e3-pill ${state[feed].s === 'ok' ? 'ok' : state[feed].s === 'error' ? 'cr' : ''}"><i></i>${state[feed].s}</span>` : '<span class="e3-pill"><i></i>n/d</span>'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = lead('Quién es esta entidad, y con qué certeza',
    'Antes de cualquier conclusión, el expediente declara cómo resolvió la identidad en cada fuente. Una entidad puede estar resuelta por RUT en un radar y ser sólo una coincidencia de nombre en otro: toda inferencia hereda la certeza del eslabón más débil.') + `
    <div class="g21">
      <div class="card"><div class="ct">Resolución de identidad por fuente</div>
        <div class="e3-scroll"><table class="dtbl"><thead><tr><th>Fuente</th><th>Identidad</th><th>Método</th><th style="text-align:right">Conf.</th><th>Archivo consultado</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="e3-note"><strong>La clave global exige RUT válido.</strong> Sin dígito verificador conforme, una fuente aporta candidatos pero nunca identidad. Sólo las fuentes en estado RESUELTA cuentan para la convergencia de la carátula.</div>
      </div>
      <div class="card"><div class="ct">Conflictos abiertos</div>
        ${d.conflicts.length ? d.conflicts.map(c => `<div class="e3-item"><div class="e3-mk">!</div><div><h4>${E(c.t)}</h4><p>${c.d}</p></div></div>`).join('')
          : '<div class="e3-empty">Sin conflictos de identidad detectados entre las fuentes disponibles.</div>'}
      </div>
    </div>
    <div class="card"><div class="ct">Denominaciones observadas</div>
      ${d.alias.length ? `<div class="e3-scroll"><table class="dtbl"><thead><tr><th>Denominación</th><th>Fuente</th><th>Campo</th></tr></thead><tbody>${
        d.alias.map(a => `<tr><td style="font-weight:600">${E(a[0])}</td><td style="color:var(--tx2)">${E(a[1])}</td><td style="font-family:'SF Mono',Menlo,monospace;font-size:11px;color:var(--txm)">${E(a[2])}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="e3-empty">Ninguna fuente disponible publica una denominación para este RUT.</div>'}
    </div>`;
}

// ── 02 caracterización ─────────────────────────────────────────────
function lCar(el, d){
  const s = d.sii;
  const ficha = s ? [
    ['Estado tributario', s.tax_status === 'ACTIVE_AS_PUBLISHED' ? 'Activo según publicación' : (s.tax_status || '—')],
    ['Tipo de contribuyente', s.taxpayer_type || '—'],
    ['Subtipo', (s.taxpayer_subtype || '—') + (s.taxpayer_subtype_code ? ' · ' + s.taxpayer_subtype_code : '')],
    ['Inicio de actividades', s.start_date || 'sin dato publicado'],
    ['Término de giro', s.termination_date || 'sin registro'],
    ['Actividad principal', s.main_activity || '—'],
    ['ACTECO vigentes', String((s.acteco || []).length)],
    ['Región principal', s.main_region || '—'],
    ['Año comercial observado', String(s.commercial_year || '—')],
    ['Tramo de ventas', s.sales_band_label || '—'],
    ['Trabajadores informados', s.workers == null ? '—' : N(s.workers)],
    ['Capital propio negativo', s.negative_equity_band ? 'informado' : 'no informado'],
    ['Años con historia', (s.history_available_years || []).join(', ') || '—'],
  ] : null;

  const trig = d.screen.filter(x => x.cls);
  const actRows = d.screen.length ? d.screen.map(a => {
    const pill = a.cls === 'A' ? '<span class="e3-pill cr"><i></i>A · gatillante</span>'
      : a.cls === 'A_REGISTRO' ? '<span class="e3-pill hi"><i></i>A · registro externo</span>'
      : a.cls === 'B' ? '<span class="e3-pill mid"><i></i>B · candidato</span>'
      : '<span class="e3-pill"><i></i>sin clase gatillante</span>';
    return `<tr><td style="font-family:'SF Mono',Menlo,monospace;font-weight:600">${E(a.code)}</td>
      <td style="font-size:11px;color:var(--tx2);max-width:250px">${E(a.glosa)}</td>
      <td><span class="e3-pill ${/VIGENTE/i.test(a.estado) ? 'ok' : ''}"><i></i>${E(a.estado || '—')}</span></td>
      <td style="font-size:11px">${a.sector ? E(a.sector) : '<span style="color:var(--txm)">sin equivalencia en la política</span>'}</td>
      <td>${pill}</td></tr>`;
  }).join('') : '';

  CH.peers = {draw:w => peerChart(w, d)};

  el.innerHTML = lead('Qué es esta entidad, y cómo se compara',
    'Descripción registral y posición frente a entidades comparables. Un tramo de ventas alto no dice nada por sí solo: dice algo cuando se lee contra un grupo de pares, con el tamaño de ese grupo a la vista.') + `
    <div class="g12">
      <div class="card"><div class="ct">Ficha registral</div>
        ${ficha ? `<dl class="e3-dl">${ficha.map(([k, v]) => `<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl>
        <div class="e3-note">Campos SII entregados por el enriquecimiento de Presupuesto Abierto. Cortes declarados: estado registral y ACTECO ${E((d.enrichMeta && d.enrichMeta.RADAR_SII && d.enrichMeta.RADAR_SII.published_updates && d.enrichMeta.RADAR_SII.published_updates.sii_activities_current) || 's/f')}; ventas y trabajadores, último año comercial publicado.</div>`
        : `<div class="e3-empty">Este RUT no está en el universo enriquecido publicado (${cache.enrich ? N(Object.keys(cache.enrich.entities).length) : '—'} entidades). La ficha registral completa exige el Parquet del Radar SII, que no se publica en Pages.</div>`}
      </div>
      <div class="card"><div class="ct">Posición frente a pares</div>
        ${d.peers && d.peers.ok ? `<div style="font-size:11px;color:var(--txm);margin:-6px 0 12px">Grupo: <b style="color:var(--tx2)">${E(d.peers.level)}</b> · n=${N(d.peers.n)}${d.peers.fellBack ? ' · se bajó de nivel por grupo insuficiente' : ''}${d.peers.sufficient ? '' : ' · <span style="color:var(--cm)">grupo insuficiente (&lt;20), leer con reserva</span>'}</div>` : ''}
        <div data-e3chart="peers"></div>
        <div class="e3-note warn"><strong>No es el grupo de pares canónico.</strong> Context Hub define el benchmark sobre ACTECO × comuna × año con un mínimo de 20 pares, pero no publica esa tabla en Pages. Lo anterior se calcula sobre el universo enriquecido publicado (${cache.enrich ? N(Object.keys(cache.enrich.entities).length) : '—'} entidades), que es una muestra sesgada hacia proveedores del Estado.</div>
      </div>
    </div>
    <div class="card"><div class="ct">Giros vigentes y perímetro UAF</div>
      ${actRows ? `<div class="e3-scroll"><table class="dtbl"><thead><tr><th>ACTECO</th><th>Glosa</th><th>Estado</th><th>Sector UAF compatible</th><th>Clase de screening</th></tr></thead><tbody>${actRows}</tbody></table></div>`
        : '<div class="e3-empty">Sin ACTECO publicados para este RUT.</div>'}
      <div class="e3-note ${trig.length ? 'warn' : ''}">
        <strong>${trig.length ? trig.length + ' giro(s) con clase gatillante.' : 'Ningún giro alcanza clase gatillante.'}</strong>
        La clase proviene de <code>${E(SCREEN_SRC)}</code>. Una coincidencia ACTECO señala compatibilidad sectorial y <b>no acredita</b> la calidad jurídica de sujeto obligado; la clase A_REGISTRO depende de una autorización que no se deduce del código.

// ── 03 cronología ──────────────────────────────────────────────────

}
