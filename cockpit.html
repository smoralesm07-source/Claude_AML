*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden;font-size:13px;line-height:1.5}
/* SIDEBAR */
#sb{width:var(--sid);background:var(--s1);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:50;border-right:1px solid var(--bd)}
.brand{padding:20px 16px 16px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.brand-tag{font-size:9px;letter-spacing:3px;color:var(--ac);font-weight:800;text-transform:uppercase;margin-bottom:6px;opacity:.9}
.brand-name{font-size:16px;color:var(--tx);font-weight:800;line-height:1.15;letter-spacing:-.03em}
.brand-ver{font-size:10px;color:var(--txm);margin-top:5px;font-variant-numeric:tabular-nums}
.nav-sec{padding:4px 0}
.nav-lbl{padding:8px 16px 3px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--txm);text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 12px;cursor:pointer;border:none;background:0 0;color:var(--tx2);width:100%;text-align:left;font-size:12.5px;transition:.12s;border-left:3px solid transparent;font-family:inherit;font-weight:500}
.ni:hover{background:rgba(59,130,246,.07);color:var(--tx)}
.ni.on{background:rgba(59,130,246,.1);color:var(--ac);border-left-color:var(--ac)}
.ni-ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni-bd{margin-left:auto;background:var(--cr);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:99px;min-width:18px;text-align:center}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tb{height:var(--top);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
#tb-title{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:-.02em}
#tb-sep{color:var(--bds);font-size:16px;margin:0 2px}
#ct{flex:1;overflow-y:auto;padding:22px}
/* CONTROLS */
.fsel{border:1px solid var(--bd);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--tx2);background:var(--s2);cursor:pointer;font-family:inherit;font-weight:500}
.fbtn{border:1px solid var(--bd);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--s2);color:var(--tx2);font-family:inherit;transition:.12s;font-weight:500}
.fbtn.on,.fbtn:hover{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:var(--ac)}
.sinp{border:1px solid var(--bd);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--tx);background:var(--s2);width:200px;font-family:inherit}
.sinp:focus{outline:none;border-color:rgba(59,130,246,.5);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fbr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tb-acts{margin-left:auto;display:flex;gap:6px}
.btn{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--tx2);font-family:inherit;transition:.12s}
.btn:hover{border-color:rgba(59,130,246,.3);color:var(--ac)}
.btn-p{background:var(--acg);color:#fff;border-color:transparent}
.btn-p:hover{opacity:.9;color:#fff}
/* LAYOUT */
.mh{margin-bottom:20px}
.mh h1{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.03em;line-height:1.1}
.mh p{font-size:12px;color:var(--tx2);margin-top:4px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--s1);border-radius:var(--rad);padding:14px 16px;border:1px solid var(--bd);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kc,var(--ac))}
.kpi.sii{--kc:var(--sii)}.kpi.uaf{--kc:var(--uaf)}.kpi.cgr{--kc:var(--cgr)}
.kpi.del{--kc:var(--del)}.kpi.pre{--kc:var(--pre)}.kpi.san{--kc:var(--san)}
.kpi.osl{--kc:var(--osl)}.kpi.cr{--kc:var(--cr)}.kpi.hi{--kc:var(--ch)}.kpi.acc{--kc:var(--ac)}
.kl{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:28px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ks{font-size:11px;color:var(--txm)}
.ksp{position:absolute;bottom:10px;right:12px;opacity:.7}
.card{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:16px;margin-bottom:14px}
.ct{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:12px;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
/* BADGES */
.bd{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.1px}
.bd.sii{background:var(--sii-bg);color:var(--sii-tx)}.bd.uaf{background:var(--uaf-bg);color:var(--uaf-tx)}
.bd.cgr{background:var(--cgr-bg);color:var(--cgr-tx)}.bd.del{background:var(--del-bg);color:var(--del-tx)}
.bd.pre{background:var(--pre-bg);color:var(--pre-tx)}.bd.san{background:var(--san-bg);color:var(--san-tx)}
.bd.osl{background:var(--osl-bg);color:var(--osl-tx)}
.rk{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700}
.rk.cr{background:var(--cr-bg);color:var(--cr)}.rk.hi{background:var(--ch-bg);color:var(--ch)}
.rk.md{background:var(--cm-bg);color:var(--cm)}.rk.lo{background:var(--cl-bg);color:var(--cl)}
/* TABLE */
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
.dtbl td{padding:9px 10px;border-bottom:1px solid var(--bd)}
.dtbl tr:last-child td{border-bottom:none}
.dtbl tbody tr:hover td{background:var(--s2)}
/* HALLAZGO CARDS */
.hcard{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:16px;margin-bottom:13px;transition:box-shadow .18s,transform .18s}
.hcard:hover{box-shadow:0 4px 24px rgba(0,0,0,.18);transform:translateY(-1px)}
.hcard.cr{border-top:2px solid var(--cr)}.hcard.hi{border-top:2px solid var(--ch)}
.hcard.md{border-top:2px solid var(--cm)}.hcard.lo{border-top:2px solid var(--cl)}
.htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.hid h3{font-size:14px;font-weight:700;letter-spacing:-.02em}
.hid .rut{font-size:11px;color:var(--txm);margin-top:2px;font-family:'SF Mono',Menlo,monospace}
.hid .metas{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.hscore{text-align:center;flex-shrink:0;margin-left:14px}
.sigs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.sc{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:500;border:1px solid}
.hyp{background:var(--s2);border-radius:7px;padding:10px 13px;margin-bottom:9px;border-left:3px solid var(--ac)}
.hyp-lbl{font-size:9px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.hyp-tx{font-size:12px;color:var(--tx2);line-height:1.6}
.nxt{display:flex;flex-wrap:wrap;gap:4px}
.nxt-s{background:var(--s2);padding:3px 9px;border-radius:5px;font-size:11px;color:var(--tx2);border:1px solid var(--bd)}
/* GUARDRAIL */
.gr{background:var(--s2);border:1px solid var(--bd);border-left:3px solid var(--txm);border-radius:7px;padding:10px 14px;font-size:11px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.gr strong{color:var(--tx)}
/* PROGRESS */
.pb{height:5px;background:var(--bd);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px}
/* TAG */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
/* REGION ROW */
.rrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.rrow:last-child{border-bottom:none}
.rname{width:160px;font-size:12px;flex-shrink:0;font-weight:500}
.rbw{flex:1}.rval{width:52px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.rct{width:50px;text-align:right;font-size:11px;color:var(--txm)}
/* ANOM */
.ac{background:var(--s1);border-radius:var(--rad);border:1px solid var(--bd);padding:14px;margin-bottom:10px}
.ah{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.at{font-size:13px;font-weight:700;letter-spacing:-.01em}
.adesc{font-size:12px;color:var(--tx2);margin-bottom:8px;line-height:1.6}
.aev{font-size:11px;color:var(--txm)}
/* METRIC PAIR */
.mpair{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.mpair .delta{font-size:11px;font-weight:600}
.delta.up{color:var(--cr)}.delta.dn{color:var(--cl)}
code.rut{font-family:'SF Mono',Menlo,monospace;font-size:12px;color:var(--tx2)}
@media(max-width:800px){.g2,.g3,.g12,.g21{grid-template-columns:1fr}}
</style>

function rc(s){return s>=80?'cr':s>=60?'hi':s>=40?'md':'lo'}

function rcol(s){

  return s>=80?st.getPropertyValue('--cr').trim():s>=60?st.getPropertyValue('--ch').trim():s>=40?st.getPropertyValue('--cm').trim():st.getPropertyValue('--cl').trim();
}

function gauge(score){
  const cls=rc(score);
  const col=`var(--${cls==='cr'?'cr':cls==='hi'?'ch':cls==='md'?'cm':'cl'})`;
  const r=22,cx=28,cy=28,perim=2*Math.PI*r,dash=(score/100)*perim;
  return`<svg width="56" height="56"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="4.5"/>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="4.5" stroke-dasharray="${dash.toFixed(1)} ${perim.toFixed(1)}" stroke-dashoffset="${(perim*.25).toFixed(1)}" stroke-linecap="round"/>
<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${col}" font-family="system-ui,sans-serif">${score}</text></svg>`;
}

function sparkline(data,w,h,color){
  const max=Math.max(...data),min=Math.min(...data),range=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/range)*(h-4)-2}`).join(' ');
  const id='sg'+uid();
  return`<svg width="${w}" height="${h}" style="display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
<polyline points="${pts} ${w},${h} 0,${h}" fill="url(#${id})" stroke="none"/>
<polyline points="${pts}" stroke="${color}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function donut(segs,W,H,label){
  const cx=W/2,cy=H/2,r=Math.min(W,H)/2-6,ri=r*.58;
  const total=segs.reduce((a,s)=>a+s.v,0);
  const gap=0.04;
  let angle=-Math.PI/2,paths='',legend='';
  segs.forEach((s,i)=>{
    const slice=(s.v/total)*(2*Math.PI-gap*segs.length);
    const a1=angle+gap/2,a2=a1+slice;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const x3=cx+ri*Math.cos(a2),y3=cy+ri*Math.sin(a2);
    const x4=cx+ri*Math.cos(a1),y4=cy+ri*Math.sin(a1);
    const lg=slice>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${ri},${ri} 0 ${lg},0 ${x4.toFixed(1)},${y4.toFixed(1)} Z" fill="${s.c}"/>`;
    angle+=slice+gap;
    legend+=`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:${s.c};display:inline-block;flex-shrink:0"></span>${s.l}</span>`;
  });
  return`<div style="display:flex;flex-direction:column;align-items:center">
<svg width="${W}" height="${H}">${paths}
<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--tx)" font-family="system-ui,sans-serif">${total}</text>
<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--tx2)" font-family="system-ui,sans-serif">${label}</text></svg>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px">${legend}</div></div>`;
}

function hbar(data,w,h,lw=140){
  const maxV=Math.max(...data.map(d=>d.v))||1;
  const rh=h/data.length;
  let s='';
  data.forEach((d,i)=>{
    const y=i*rh;
    const bw=Math.max(2,(d.v/maxV)*(w-lw-52));
    const bh=rh*.5,by=y+rh*.25;
    s+=`<text x="0" y="${y+rh*.65}" font-size="11" fill="var(--tx2)" font-family="system-ui,sans-serif">${d.l}</text>`;
    s+=`<rect x="${lw}" y="${by}" width="${bw}" height="${bh}" fill="${d.c||'var(--ac)'}" rx="3"/>`;
    s+=`<text x="${lw+bw+5}" y="${y+rh*.65}" font-size="10" fill="var(--tx)" font-weight="700" font-variant-numeric="tabular-nums" font-family="system-ui,sans-serif">${fmt(d.v)}</text>`;
  });
  return`<svg width="${w}" height="${h}" style="overflow:visible;display:block">${s}</svg>`;
}

function vbar(data,w,h){
  const pad=20,iW=w-pad*2,iH=h-28,maxV=Math.max(...data.map(d=>d.v))*1.08||1;
  const bw=Math.max(8,iW/data.length-6);
  let s='';
  // grid lines
  [.33,.66,1].forEach(f=>{const y=8+iH-(f*iH);s+=`<line x1="${pad}" y1="${y}" x2="${pad+iW}" y2="${y}" stroke="var(--bd)" stroke-width="1"/>`});
  data.forEach((d,i)=>{
    const bh=Math.max(2,(d.v/maxV)*iH);
    const x=pad+i*(iW/data.length)+(iW/data.length-bw)/2;
    const y=8+iH-bh;
    const id2='vg'+uid();
    s+=`<defs><linearGradient id="${id2}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${d.c||'var(--ac)'}" stop-opacity="1"/><stop offset="100%" stop-color="${d.c||'var(--ac)'}" stop-opacity=".5"/></linearGradient></defs>`;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="url(#${id2})" rx="4"/>`;
    s+=`<text x="${x+bw/2}" y="${8+iH+16}" text-anchor="middle" font-size="9" fill="var(--tx2)" font-family="system-ui,sans-serif">${d.l}</text>`;
    s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--tx)" font-weight="700" font-family="system-ui,sans-serif">${d.v}</text>`;
  });
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function linechart(datasets,labels,w,h){
  const pl=32,pr=8,pt=10,pb=22,iW=w-pl-pr,iH=h-pt-pb;
  const allV=datasets.flatMap(d=>d.data);
  const maxV=Math.max(...allV)*1.12||1;
  const n=labels.length;
  const px=i=>pl+(i/(n-1))*iW;
  const py=v=>pt+iH-(v/maxV)*iH;
  let s='';
  // grid
  [.25,.5,.75,1].forEach(f=>{
    const y=py(maxV*f);
    s+=`<line x1="${pl}" y1="${y}" x2="${pl+iW}" y2="${y}" stroke="var(--bd)" stroke-width="1" stroke-dasharray="3,4"/>`;
    s+=`<text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="8" fill="var(--txm)" font-family="system-ui,sans-serif">${Math.round(maxV*f)}</text>`;
  });
  datasets.forEach(ds=>{
    const pts=ds.data.map((v,i)=>({x:px(i),y:py(v)}));
    const area=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+` L${px(n-1).toFixed(1)},${(pt+iH).toFixed(1)} L${px(0).toFixed(1)},${(pt+iH).toFixed(1)} Z`;
    const line=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const gid='lg'+uid();
    s+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${ds.c}" stop-opacity=".2"/><stop offset="100%" stop-color="${ds.c}" stop-opacity="0"/></linearGradient></defs>`;
    s+=`<path d="${area}" fill="url(#${gid})"/>`;
    s+=`<path d="${line}" stroke="${ds.c}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
    const last=pts[pts.length-1];
    s+=`<circle cx="${last.x}" cy="${last.y}" r="3.5" fill="${ds.c}"/>`;
  });
  labels.forEach((l,i)=>{s+=`<text x="${px(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="8.5" fill="var(--txm)" font-family="system-ui,sans-serif">${l}</text>`});
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function heatmap(rows,cols,data,w,h){
  const cw=Math.floor((w-60)/cols),ch=Math.floor((h-22)/rows);
  const maxV=Math.max(...data.flat())||1;
  let s='';
  cols>0&&[...Array(cols)].forEach((_,j)=>{s+=`<text x="${60+j*cw+cw/2}" y="14" text-anchor="middle" font-size="8" fill="var(--txm)" font-family="system-ui,sans-serif">${MO[j]?.m||j}</text>`});
  data.forEach((row,i)=>{
    s+=`<text x="55" y="${22+i*ch+ch/2+4}" text-anchor="end" font-size="9" fill="var(--tx2)" font-family="system-ui,sans-serif">${rows[i]}</text>`;
    row.forEach((v,j)=>{
      const a=v/maxV;
      s+=`<rect x="${60+j*cw+1}" y="${22+i*ch+1}" width="${cw-2}" height="${ch-2}" fill="var(--ac)" opacity="${a*.85+.05}" rx="2"/>`;
      if(v>0)s+=`<text x="${60+j*cw+cw/2}" y="${22+i*ch+ch/2+4}" text-anchor="middle" font-size="8.5" fill="var(--tx)" font-weight="${v>maxV*.5?'700':'400'}" font-family="system-ui,sans-serif">${v}</text>`;
    });
  });
  return`<svg width="${w}" height="${h}" style="display:block">${s}</svg>`;
}

function buildMap(layer){
  const getVal=(r,l)=>{
    const f=REG.find(x=>x.id===r.id);
    if(!f)return 0;
    return l==='risk'?f.risk:l==='del'?f.cr:l==='so'?f.so:l==='sp'?Math.round(f.sp/1e3):f.osfl;
  };
  const vals=CGEO.map(r=>getVal(r,layer));
  const maxV=Math.max(...vals)||1;
  let s='';
  CGEO.forEach((r,i)=>{
    const nxt=CGEO[i+1]||{xl:r.xl,xr:r.xr};
    const v=vals[i],frac=v/maxV;
    const intensity=layer==='risk'?v:frac*100;
    const col=intensity>=75?'var(--cr)':intensity>=55?'var(--ch)':intensity>=35?'var(--cm)':'var(--cl)';
    const pts=`${r.xl},${r.y} ${r.xr},${r.y} ${nxt.xr},${r.y+r.h} ${nxt.xl},${r.y+r.h}`;
    const mx=(r.xl+r.xr)/2,my=r.y+r.h/2;
    s+=`<polygon points="${pts}" fill="${col}" stroke="var(--bg)" stroke-width="1.5" opacity=".88" data-id="${r.id}" style="cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.88" onclick="selectReg('${r.id}')"/>`;
    s+=`<text x="${mx}" y="${my+(r.h>30?4:3)}" text-anchor="middle" font-size="${r.h>40?9:8}" fill="rgba(255,255,255,.95)" font-weight="700" pointer-events="none" font-family="system-ui,sans-serif">${r.id}</text>`;
  });
  return`<svg id="mapa-svg" width="185" height="782" style="flex-shrink:0;border-radius:8px">${s}</svg>`;
}

    {n:'Presupuesto Abierto',ei:1,te:1,se:1,pe:1,cov:'Nacional',upd:'Diario',st:'✓'},
    {n:'Radar Sanciones',ei:1,te:0,se:1,pe:1,cov:'Parcial',upd:'Variable',st:'⚠'},

  ];
  const ck=v=>v?'<span style="color:var(--cl);font-weight:700">✓</span>':'<span style="color:var(--txm)">—</span>';
  const rows=srcs.map(s=>`<tr><td><strong>${s.n}</strong></td>
    <td style="text-align:center">${ck(s.ei)}</td><td style="text-align:center">${ck(s.te)}</td>
    <td style="text-align:center">${ck(s.se)}</td><td style="text-align:center">${ck(s.pe)}</td>
    <td>${s.cov}</td><td>${s.upd}</td><td style="font-size:14px;text-align:center">${s.st}</td></tr>`).join('');

  document.getElementById('ct').innerHTML=`
    <div class="mh"><h1>Evidencia y Trazabilidad</h1><p>Cobertura, fuente y trazabilidad de todas las señales · Principio evidence-first: missing ≠ zero</p></div>
    <div class="gr"><strong>Principio rector:</strong> La ausencia de dato en una fuente no equivale a ausencia del hecho. Cada señal está trazada a su fuente, regla y período. <code style="font-family:monospace;font-size:11px">signals.jsonl</code> y <code style="font-family:monospace;font-size:11px">scores.jsonl</code> son invariantes de producción.</div>

      <div style="overflow-x:auto"><table class="dtbl">
        <thead><tr><th>Fuente</th><th style="text-align:center">entity_id</th><th style="text-align:center">territory_id</th><th style="text-align:center">sector_id</th><th style="text-align:center">period_id</th><th>Cobertura</th><th>Actualización</th><th style="text-align:center">Estado</th></tr></thead>
        <tbody>${rows}</tbody>

function rFiscal(){
  const tot=SECT.reduce((a,b)=>a+b.so,0),ros=SECT.reduce((a,b)=>a+b.ros,0);

    <div class="kpi uaf"><div class="kl">SO Observados (UAF)</div><div class="kv">${fmt(tot)}</div><div class="ks">En nómina vigente</div></div>
    <div class="kpi cr"><div class="kl">MATCH_FUERTE (ICP)</div><div class="kv">347</div><div class="ks">Sin inscripción UAF verificada</div></div>
    <div class="kpi hi"><div class="kl">CANDIDATO (ICP)</div><div class="kv">812</div><div class="ks">Equivalencia parcial/ambigua</div></div>
    <div class="kpi pre"><div class="kl">Sin ROS en período</div><div class="kv">${fmt(tot-ros)}</div><div class="ks">${Math.round((1-ros/tot)*100)}% del universo</div></div>
    <div class="kpi san"><div class="kl">Sancionados supervisor</div><div class="kv">${SECT.reduce((a,b)=>a+b.s,0)}</div><div class="ks">Con evento adverso activo</div></div>
  </div>`;
  const W5=Math.min(340,280);
  const table=SECT.map(s=>{
    const pr=Math.round(s.ros/s.so*100),pe=Math.round(s.roe/s.so*100);
    const rkl=pr<60?'cr':pr<80?'hi':'lo';
    return`<tr><td>${s.n}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${s.so}</td>
      <td style="text-align:right"><span class="rk ${rkl}">${pr}%</span></td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${pe}%</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${s.s}</td></tr>`;
  }).join('');
  document.getElementById('ct').innerHTML=`
    <div class="mh"><h1>Perímetro UAF · Fiscalización</h1><p>Sujetos obligados, brechas de inscripción, reportabilidad y supervisión · 55 actividades UAF</p></div>
    <div class="gr"><strong>Guardrail:</strong> ACTECO SII ≠ condición jurídica de sujeto obligado. MATCH_FUERTE identifica candidatos a validación. ICR permanece nulo hasta validación con fuente regulatoria. Alerta de fiscalización ≠ señal AML.</div>
    ${kpis}
    <div class="g2">
      <div class="card"><div class="ct">Cobertura ROS por sector</div>
        ${hbar(SECT.slice(0,8).map(s=>({l:s.n.length>24?s.n.slice(0,24)+'…':s.n,v:Math.round(s.ros/s.so*100),c:s.ros/s.so>=.8?'var(--cl)':s.ros/s.so>=.6?'var(--cm)':'var(--cr)'})),W5,240,185)}
      </div>
      <div class="card"><div class="ct">SO por región · Top 6</div>
        ${vbar([...REG].sort((a,b)=>b.so-a.so).slice(0,6).map(r=>({l:r.id,v:r.so,c:rcol(r.risk)})),W5,140)}
      </div>
    </div>
    <div class="card"><div class="ct">Reportabilidad por sector</div>
      <div style="overflow-x:auto"><table class="dtbl">
        <thead><tr><th>Sector</th><th style="text-align:right">SO</th><th style="text-align:right">% ROS</th><th style="text-align:right">% ROE</th><th style="text-align:right">Sancionados</th></tr></thead>
        <tbody>${table}</tbody>
      </table></div>
    </div>`;
}

function rSanciones(){
  const alacft=SAN.filter(s=>s.mat.includes('ALA')).length;

  const rows=SAN.map(s=>{
    const rc2=s.r?'<span class="rk cr">Reincidente</span>':'<span class="rk lo">1ª vez</span>';
    const ac2=s.ac?'<span style="color:var(--cl);font-size:11px;font-weight:600">✓ Resuelto</span>':'<span style="color:var(--ch);font-size:11px;font-weight:600">● Activo</span>';
    const ala=s.mat.includes('ALA')?`<span style="font-size:10px;padding:1px 7px;border-radius:4px;background:var(--uaf-bg);color:var(--uaf-tx);font-weight:700">ALA/CFT</span>`:'';
    return`<tr><td><strong>${s.e}</strong><br><code class="rut">${s.rut}</code></td>

      <td style="font-variant-numeric:tabular-nums;font-weight:600">${s.m}</td>

  const autSegs=[{l:'CMF',v:3,c:'var(--cgr)'},{l:'UAF',v:1,c:'var(--uaf)'},{l:'SVS',v:1,c:'var(--sii)'},{l:'Otros',v:1,c:'var(--txm)'}];

    <div class="g2" style="margin-bottom:14px">

        <div class="kpi hi"><div class="kl">Reincidentes</div><div class="kv">${rein}</div><div class="ks">Con ≥2 eventos adversos</div></div>
        <div class="kpi acc"><div class="kl">Procesos activos</div><div class="kv">${pend}</div><div class="ks">Sin resolución definitiva</div></div>
      </div>
    </div>
    <div class="g21" style="margin-bottom:14px">
      <div class="card"><div class="ct">Registro detallado</div>
        <div style="overflow-x:auto"><table class="dtbl">
          <thead><tr><th>Entidad</th><th>Autoridad</th><th>Materia</th><th>Fecha</th><th>Monto</th><th>Reincidencia</th><th>Estado</th></tr></thead>

      </div>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="ct" style="width:100%">Por autoridad sancionadora</div>
        ${donut(autSegs,150,150,'sanciones')}

    </div>
    <div class="gr"><strong>Guardrail:</strong> Sanción prudencial ≠ LA/FT. Una sanción puede elevar la plausibilidad de una hipótesis, no la confirma. Las identidades sin resolver se muestran como pendientes hasta confirmación con la fuente regulatoria competente.</div>`;
}

function sw(btn){
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const m=btn.dataset.m;
  document.getElementById('tb-title').textContent=TITLES[m]||m;
  const fn=RENDERS[m];if(fn)fn();
}

function toggleTheme(){
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme',cur==='light'?'dark':'light');
}
