// ── 05 señales ─────────────────────────────────────────────────────
const SEV = {HIGH:{c:'cr', v:'--cr', l:'Alta'}, MEDIUM:{c:'hi', v:'--ch', l:'Media'}, LOW:{c:'', v:'--txm', l:'Baja'}};
function lSig(el, d){
  CH.mx = {draw:w => matrixChart(w, d), bind:bindMatrix};
  const counters = autoCounters(d);
  const sigs = d.signals.length ? d.signals.map((s, i) => {
    const sv = SEV[s.sev] || SEV.LOW;
    const typ = TYP.find(t => t.id === s.typ);
    return `<div class="e3-sig">
      <span class="e3-stripe" style="background:var(${sv.v})"></span>
      <div>
        <div class="e3-code">${E(s.code)}</div>
        <div class="e3-why">${E(s.why)}</div>
        ${s.checks ? `<div class="e3-chk"><b style="color:var(--tx2)">Descartes obligatorios:</b> ${E(s.checks)}</div>` : ''}
        <div class="e3-tags">
          <span class="e3-pill out" style="color:${svar(s.src)}"><i></i>${E(RADAR[s.src].name)}</span>
          ${typ ? `<span class="e3-pill">${E(typ.n)}</span>` : ''}
          <span class="e3-pill" style="font-family:'SF Mono',Menlo,monospace">${E(s.period)}</span>
          ${s.tier ? `<span class="e3-pill ${s.tier === 'P1' ? 'cr' : s.tier === 'P2' ? 'hi' : ''}"><i></i>${s.tier}</span>` : ''}
          <button class="e3-link" data-sig="${i}">Evidencia</button>
        </div>
      </div>
      <div class="e3-right"><span class="e3-pill ${sv.c}"><i></i>Severidad ${sv.l}</span>
        <span style="font-size:10px;color:var(--txm)">confianza ${E(String(s.conf).toLowerCase())}</span></div>
    </div>`;
  }).join('') : '<div class="e3-empty">Ninguna fuente disponible publica señales para este RUT. Con la cola de Presupuesto truncada y el registro UAF parcial, esto no equivale a ausencia de señales.</div>';

  el.innerHTML = lead('Qué dice cada señal, cuánto se corrobora y qué la contradice',
    'Esta vista sustituye el puntaje único. En su lugar: una matriz que separa la corroboración real de la repetición de una misma fuente, el catálogo de señales con la regla y los descartes que cada radar exige, los contra-indicios y los vacíos declarados.') + `
    <div class="g2">
      <div class="card"><div class="ct">Matriz de convergencia</div>
        <div data-e3chart="mx"></div>
        <div class="e3-note"><strong>Cómo leerla.</strong> Una fila con celdas en varias columnas es corroboración entre radares independientes. Una fila oscura en una sola columna es una fuente insistiendo, y pesa mucho menos aunque sume más señales.</div>
      </div>
      <div class="card"><div class="ct">Contra-indicios</div>
        ${counters.length ? counters.map(c => `<div class="e3-item"><div class="e3-mk good">−</div><div><h4>${E(c.t)}</h4><p>${c.d}</p></div></div>`).join('')
          : '<div class="e3-empty">No se derivaron contra-indicios automáticos. Los contra-indicios documentales (contratos marco, fusiones, hitos contractuales) los aporta el analista al instruir el expediente.</div>'}
        <div class="e3-note">Los descartes que exige cada catálogo — contratos marco, facturación periódica, estados de pago, monopolios técnicos — son contra-indicios en potencia. Un expediente que no los busca no es un análisis.</div>
      </div>
    </div>
    <div class="card"><div class="ct">Señales gobernadas · ${d.signals.length}</div>${sigs}</div>
    <div class="card"><div class="ct">Vacíos declarados · ${d.gaps.length}</div>
      ${d.gaps.map(g => `<div class="e3-item"><div class="e3-mk">?</div><div><h4>${E(g.t)}</h4><p>${g.d}</p>
        <div style="margin-top:5px"><span class="e3-pill ${g.s === 'FALLO' ? 'cr' : g.s === 'PARCIAL' ? 'mid' : ''}"><i></i>${E(g.s.replace('_', ' '))}</span></div></div></div>`).join('')}
      <div class="e3-note"><strong>La ausencia de dato no es un cero.</strong> Todos los radares declaran <code>source_failure_is_zero = false</code> y preservan el último snapshot válido. Esta vista replica esa regla: nada de lo anterior se computa como evidencia negativa.</div>
    </div>`;
  el.querySelectorAll('[data-sig]').forEach(b => b.addEventListener('click', () => evidenceForSignal(d.signals[+b.dataset.sig])));
}

function autoCounters(d){
  const c = [];
  const withOc = (d.preSignals || []).filter(s => s.has_purchase_order);
  if (withOc.length) c.push({t:`${withOc.length} de ${d.preSignals.length} señales tienen orden de compra asociada`,
    d:'El catálogo de Presupuesto exige descartar hitos contractuales y estados de pago legítimos antes de interpretar un monto atípico. La existencia de OC es el primer descarte documental disponible.'});
  if (d.cgr.cands.length || d.cgr.orgHits.length) c.push({t:'Los hallazgos CGR no están atribuidos a esta entidad',
    d:'El enlace es por nombre normalizado y permanece CANDIDATE. Mientras CGR no publique RUT, cualquier lectura adversa apoyada en esos hallazgos es refutable por error de identidad.'});
  if (d.uaf.hit) c.push({t:'La entidad sí figura en el registro UAF publicado',
    d:'Está inscrita como ' + E(d.uaf.hit.entity_type) + ', de modo que la compatibilidad sectorial de sus ACTECO no configura una brecha de inscripción.'});
  const nonLaft = (d.sanEvents || []).filter(e => !e.laft_directo);
  if (nonLaft.length) c.push({t:`${nonLaft.length} evento(s) adverso(s) sin materia ALA/CFT directa`,
    d:'Radar Sanciones marca <code>laft_directo = false</code> para ' + nonLaft.length + ' de los eventos: son materias de conducta de mercado o cumplimiento regulatorio, no de lavado de activos. Una sanción prudencial no acredita LA/FT.'});
  if (d.sii && d.sii.workers > 10) c.push({t:'Dotación informada consistente con la operación',
    d:`La entidad informa ${N(d.sii.workers)} trabajadores dependientes, lo que debilita la lectura de sociedad instrumental sin capacidad operativa real.`});
  return c;
}

// ── 06 hipótesis (ACH interactivo) ─────────────────────────────────
const HYPS = [
  {id:'H1', t:'Vehículo de canalización', d:'La entidad se usa para canalizar y justificar fondos de origen no acreditado a través de contratación pública.'},
  {id:'H2', t:'Operación económica genuina', d:'El patrón se explica por la escala real de la operación, su industria y su relación contractual con el Estado.'},
  {id:'H3', t:'Sociedad instrumental de un tercero', d:'La entidad es controlada de hecho por un tercero no registrado y los titulares formales actúan por cuenta ajena.'},
  {id:'H4', t:'Error de identidad', d:'Parte de la evidencia adversa pertenece a otra entidad y fue asociada por coincidencia de nombre.'},
];
let ACH = null;
function achRows(d){
  const rows = [];
  d.signals.slice(0, 14).forEach(s => rows.push({e:s.code + ' · ' + clip(s.why, 96), w:s.sev === 'HIGH' ? 3 : s.sev === 'MEDIUM' ? 2 : 1, src:s.src,
    v:{H1:'n', H2:'n', H3:'n', H4:s.src === 'cgr' ? 'c' : 'n'}}));
  if (d.rut.valid) rows.push({e:'RUT válido y resuelto en ' + d.converge + ' fuente(s) independiente(s)', w:3, src:'sii', v:{H1:'n', H2:'n', H3:'n', H4:'i'}});
  if (d.obs.pre) rows.push({e:'Los pagos del Estado están asociados a este RUT, no a un nombre', w:3, src:'pre', v:{H1:'n', H2:'n', H3:'n', H4:'i'}});
  if (d.cgr.cands.length || d.cgr.orgHits.length) rows.push({e:'Los hallazgos CGR se vinculan sólo por nombre normalizado', w:2, src:'cgr', v:{H1:'n', H2:'n', H3:'n', H4:'c'}});
  return rows;
}
function lHip(el, d){
  if (!ACH || ACH.key !== d.rut.key) ACH = {key:d.rut.key, rows:achRows(d)};
  const score = h => ACH.rows.reduce((a, r) => a + (r.v[h] === 'i' ? r.w : 0), 0);
  const cons = h => ACH.rows.reduce((a, r) => a + (r.v[h] === 'c' ? r.w : 0), 0);
  const ranked = HYPS.map(h => ({...h, inc:score(h.id), con:cons(h.id)})).sort((a, b) => a.inc - b.inc);
  const maxInc = Math.max(1, ...ranked.map(r => r.inc));
  const glyph = {c:['e3-c', '+'], i:['e3-i', '−'], n:['e3-n', '·']};
  const diag = r => new Set(HYPS.map(h => r.v[h.id])).size > 1;
  const cells = ACH.rows.length * HYPS.length;
  const judged = ACH.rows.reduce((a, r) => a + HYPS.filter(h => r.v[h.id] !== 'n').length, 0);
  const tie = ranked.length > 1 && ranked[0].inc === ranked[1].inc;
  const tied = ranked.filter(r => r.inc === ranked[0].inc).length;

  el.innerHTML = lead('Qué explicaciones compiten, y cuál resiste la evidencia',
    'El expediente no defiende una hipótesis: enfrenta varias, incluida la de que la evidencia adversa pertenezca a otra entidad. Siguiendo el análisis de hipótesis en competencia, una hipótesis no se elige por la evidencia que la confirma, sino por la que no logra refutarla.') + `
    <div class="g2">
      <div class="card"><div class="ct">Hipótesis en competencia</div>
        ${ranked.map((h, i) => `<div style="padding:12px 0;border-bottom:${i < ranked.length - 1 ? '1px solid var(--bd)' : '0'}">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
            <div style="font-size:12.5px;font-weight:700"><span style="font-family:'SF Mono',Menlo,monospace;color:var(--txm)">${h.id}</span> · ${E(h.t)}</div>
            <span class="e3-pill ${i === 0 && !tie ? 'ok' : ''}">${i === 0 && !tie ? 'mejor resiste' : 'inconsistencia ' + h.inc}</span>
          </div>
          <p style="margin:4px 0 8px;font-size:11.5px;color:var(--tx2);line-height:1.55">${E(h.d)}</p>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:5px;border-radius:3px;background:var(--s3);overflow:hidden"><div style="height:100%;width:${(h.inc / maxInc * 100).toFixed(0)}%;background:var(--cr);border-radius:3px"></div></div>
            <span style="font-size:10.5px;color:var(--txm);font-family:'SF Mono',Menlo,monospace;white-space:nowrap">${h.inc} inc · ${h.con} cons</span>
          </div></div>`).join('')}
        <div class="e3-note">${tie
          ? `<strong>${tied} hipótesis empatadas en ${ranked[0].inc} de inconsistencia.</strong> Con ${judged} de ${cells} celdas evaluadas, la evidencia todavía no las distingue: ninguna «gana». Marque las celdas que faltan, o registre cuál diligencia las separaría.`
          : `<strong>Se puntúa por inconsistencia</strong> (${judged} de ${cells} celdas evaluadas). La hipótesis que menos contradicciones acumula es la que mejor resiste, no la más probable.`}</div>
      </div>
      <div class="card"><div class="ct">Disposición del expediente</div>
        <div style="display:flex;gap:8px;flex-direction:column">
          ${[['Escalar a reporte', 'Deriva a la unidad competente con el paquete de evidencia completo.'],
             ['Mantener en vigilancia', 'Reevaluación al cambiar cualquier fuente del expediente.'],
             ['Archivar con fundamento', 'Se conserva la traza; no vuelve a la cola sin evidencia nueva.']]
            .map((o, i) => `<button class="e3-opt" aria-pressed="${i === 1}"><b>${E(o[0])}</b><span>${E(o[1])}</span></button>`).join('')}
        </div>
        <div style="margin-top:12px">
          <label class="e3-rk" for="e3just" style="display:block;margin-bottom:5px">Fundamento de la decisión</label>
          <textarea id="e3just" rows="4" style="width:100%;font:inherit;font-size:12px;padding:10px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);resize:vertical" placeholder="Qué diligencia discrimina entre las hipótesis vivas, y por qué esa es la siguiente."></textarea>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-p" id="e3sign">Registrar disposición</button>
          <button class="btn" id="e3exp">Exportar expediente</button>
          <span id="e3msg" style="font-size:11px;color:var(--txm)"></span>
        </div>
      </div>
    </div>
    <div class="card"><div class="ct">Matriz de consistencia · ${ACH.rows.length} piezas de evidencia</div>
      <div style="font-size:11.5px;color:var(--txm);margin:-6px 0 12px">Haga clic en cada celda para alternar <b>consistente (+)</b>, <b>inconsistente (−)</b> y <b>neutral (·)</b>. Las filas marcadas <span class="e3-diag">diagnóstica</span> son las que efectivamente separan hipótesis.</div>
      <div class="e3-scroll"><table class="dtbl e3-ach">
        <thead><tr><th style="min-width:260px">Evidencia</th><th>Fuente</th><th style="text-align:center">Peso</th>
        ${HYPS.map(h => `<th style="text-align:center">${h.id}</th>`).join('')}<th></th></tr></thead>
        <tbody>${ACH.rows.map((r, ri) => `<tr>
          <td style="font-size:11.5px">${E(r.e)}</td>
          <td><span class="e3-pill out" style="color:${svar(r.src)}"><i></i>${E(RADAR[r.src].name)}</span></td>
          <td style="text-align:center;color:var(--tx2);font-variant-numeric:tabular-nums">${r.w}</td>
          ${HYPS.map(h => { const g = glyph[r.v[h.id]]; return `<td class="c" data-r="${ri}" data-h="${h.id}"><span class="${g[0]}">${g[1]}</span></td>`; }).join('')}
          <td>${diag(r) ? '<span class="e3-diag">diagnóstica</span>' : ''}</td></tr>`).join('')}
          <tr style="background:var(--s2)"><td style="font-weight:700;font-size:11.5px">Inconsistencia ponderada</td><td></td><td></td>
          ${HYPS.map(h => `<td style="text-align:center;font-weight:800;font-variant-numeric:tabular-nums">${score(h.id)}</td>`).join('')}<td></td></tr>
        </tbody></table></div>
    </div>`;

  el.querySelectorAll('.e3-ach td.c').forEach(td => td.addEventListener('click', () => {
    const r = ACH.rows[+td.dataset.r], h = td.dataset.h;
    r.v[h] = r.v[h] === 'n' ? 'c' : r.v[h] === 'c' ? 'i' : 'n';
    lHip(el, d);
  }));
  el.querySelectorAll('.e3-opt').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('.e3-opt').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
  }));
  q('#e3sign').addEventListener('click', () => {
    const j = q('#e3just').value.trim();
    q('#e3msg').textContent = j ? 'Disposición registrada en esta sesión.' : 'El fundamento es obligatorio para registrar la disposición.';
    q('#e3msg').style.color = j ? 'var(--cl)' : 'var(--cr)';
  });
  q('#e3exp').addEventListener('click', () => exportDrawer(d));
}

    ])}
    <div class="e3-rk" style="margin:16px 0 6px">Archivos consultados</div>

const RENDERS={hallazgos:rHallazgos,territorio:rTerritorio,actividad:rActividad,anomalias:rAnomalias,aml360:rAml360,red:rRed,evidencia:rEvidencia,fiscal:rFiscal,sanciones:rSanciones,perfil:rPerfil};

function sw(btn){
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const m=btn.dataset.m;
  document.getElementById('tb-title').textContent=TITLES[m]||m;
  const fn=RENDERS[m];if(fn)fn();
}

function toggleTheme(){
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme',cur==='light'?'dark':'light');
}

rHallazgos();
