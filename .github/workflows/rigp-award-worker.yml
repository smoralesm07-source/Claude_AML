name: RIGP award matrix worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rigp/ops/award_request.json'

permissions:
  contents: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build request payload
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('rigp/ops/award_request.json')
          data = json.loads(p.read_text())
          items = data.get('items') or []
          if not items:
              raise SystemExit('award_request.json has no items')
          Path('/tmp/rigp-award-payload.json').write_text(json.dumps({'items': items}, ensure_ascii=False))
          print(f'items={len(items)}')
          PY

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          RESP=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rigp-mp-award-worker")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESP")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest Mercado Publico award matrices
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          HTTP=$(curl -sS -o /tmp/rigp-award-response.json -w '%{http_code}' \
            -X POST 'https://ldmtlwzqaqmegedktlxr.supabase.co/functions/v1/rigp-mp-award-worker' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/rigp-award-payload.json)
          echo "$HTTP" > /tmp/rigp-award-http.txt
          cat /tmp/rigp-award-response.json

      - name: Persist diagnostic response
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path('/tmp/rigp-award-response.json').read_text() if Path('/tmp/rigp-award-response.json').exists() else '{}'
          try:
              body = json.loads(raw)
          except Exception:
              body = {'raw': raw[:10000]}
          http = Path('/tmp/rigp-award-http.txt').read_text().strip() if Path('/tmp/rigp-award-http.txt').exists() else None
          out = {'http_status': int(http) if http and http.isdigit() else None, 'response': body}
          Path('rigp/ops/award_last_response.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rigp/ops/award_last_response.json
          if ! git diff --cached --quiet; then
            git commit -m 'rigp: record award worker response'
            git push
          fi

      - name: Validate response
        shell: bash
        run: |
          HTTP=$(cat /tmp/rigp-award-http.txt)
          if [ "$HTTP" -ge 400 ]; then
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('/tmp/rigp-award-response.json'))
          if r.get('status') == 'FAILED':
              raise SystemExit(1)
          PY
