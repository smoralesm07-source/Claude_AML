name: RIGP document text extraction

on:
  workflow_dispatch:
    inputs:
      artifact_keys:
        description: "Artifact keys separados por coma"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "rigp/ops/extraction_request.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: rigp-document-text-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build artifact list
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_KEYS: ${{ inputs.artifact_keys }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && -f rigp/ops/extraction_request.json ]]; then
            jq -r '.artifact_keys[]' rigp/ops/extraction_request.json > /tmp/artifacts.txt
          else
            printf '%s' "${INPUT_KEYS:-}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -E '^[0-9a-f]{64}$' > /tmp/artifacts.txt || true
          fi
          test -s /tmp/artifacts.txt
          echo "Artifacts to extract:"
          cat /tmp/artifacts.txt

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rigp-document-extraction")
          TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install PDF extractor
        run: python -m pip install --disable-pip-version-check --quiet "pypdf==6.0.0"

      - name: Export, extract and ingest
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          BRIDGE_URL: https://ldmtlwzqaqmegedktlxr.supabase.co/functions/v1/rigp-document-extraction-bridge
        run: |
          set -euo pipefail
          while IFS= read -r KEY; do
            [[ -z "$KEY" ]] && continue
            echo "Extracting $KEY"
            jq -n --arg key "$KEY" '{action:"export",artifact_key:$key}' > /tmp/export-request.json
            CODE=$(curl -sS -o /tmp/document.pdf -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/export-request.json \
              "$BRIDGE_URL")
            if [[ "$CODE" -ge 400 ]]; then
              echo "Export failed HTTP $CODE for $KEY"
              cat /tmp/document.pdf || true
              exit 1
            fi

            python - "$KEY" /tmp/document.pdf /tmp/payload.json <<'PY'
import json, sys
from pathlib import Path
from pypdf import PdfReader
from pypdf import __version__ as pypdf_version

key, pdf_path, out_path = sys.argv[1:4]
try:
    reader = PdfReader(pdf_path, strict=False)
    pages = []
    parts = []
    warnings = []
    for i, page in enumerate(reader.pages, start=1):
        try:
            text = page.extract_text() or ""
        except Exception as exc:
            text = ""
            warnings.append({"page": i, "error": str(exc)[:300]})
        text = text.replace("\x00", "").strip()
        pages.append({"page": i, "text": text})
        if text:
            parts.append(f"--- PAGE {i} ---\n{text}")
    full = "\n\n".join(parts)
    if len(full) > 3_900_000:
        full = full[:3_900_000]
        warnings.append({"warning": "TEXT_TRUNCATED_AT_3_9M_CHARS"})
    status = "EXTRACTED" if full.strip() else "EMPTY"
    payload = {
        "artifact_key": key,
        "extractor": "pypdf",
        "extractor_version": pypdf_version,
        "extraction_status": status,
        "page_count": len(reader.pages),
        "extracted_text": full,
        "page_text": pages,
        "metadata": {
            "workflow": "rigp-document-extract",
            "warnings": warnings,
            "source_size_bytes": Path(pdf_path).stat().st_size,
        },
    }
except Exception as exc:
    payload = {
        "artifact_key": key,
        "extractor": "pypdf",
        "extractor_version": pypdf_version,
        "extraction_status": "FAILED",
        "page_count": 0,
        "extracted_text": "",
        "page_text": [],
        "metadata": {"workflow": "rigp-document-extract", "error": str(exc)[:500]},
    }
Path(out_path).write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
print(json.dumps({"artifact_key": key, "status": payload["extraction_status"], "pages": payload["page_count"], "chars": len(payload["extracted_text"])}, ensure_ascii=False))
PY

            jq -n --slurpfile p /tmp/payload.json '{action:"ingest",payload:$p[0]}' > /tmp/ingest-request.json
            ICODE=$(curl -sS -o /tmp/ingest-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/ingest-request.json \
              "$BRIDGE_URL")
            cat /tmp/ingest-response.json
            if [[ "$ICODE" -ge 400 ]]; then
              echo "Ingest failed HTTP $ICODE for $KEY"
              exit 1
            fi
            rm -f /tmp/document.pdf /tmp/payload.json /tmp/ingest-request.json /tmp/ingest-response.json
          done < /tmp/artifacts.txt
