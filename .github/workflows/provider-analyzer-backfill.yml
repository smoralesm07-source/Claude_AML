name: Provider Anomaly Analyzer · historical backfill
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Año inicial
        required: false
        default: '2024'
        type: string
      start_month:
        description: Mes inicial
        required: false
        default: '1'
        type: string
      end_year:
        description: Año final; vacío = último mes completo
        required: false
        default: ''
        type: string
      end_month:
        description: Mes final; vacío = último mes completo
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'provider_analyzer/ops/backfill_request.json'
permissions:
  contents: read
  id-token: write
concurrency:
  group: provider-analyzer-backfill
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e provider_analyzer
      - id: request
        shell: bash
        env:
          INPUT_START_YEAR: ${{ inputs.start_year }}
          INPUT_START_MONTH: ${{ inputs.start_month }}
          INPUT_END_YEAR: ${{ inputs.end_year }}
          INPUT_END_MONTH: ${{ inputs.end_month }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              request = json.loads(Path('provider_analyzer/ops/backfill_request.json').read_text(encoding='utf-8'))
              start_year = str(request.get('start_year') or '')
              start_month = str(request.get('start_month') or '')
              end_year = str(request.get('end_year') or '')
              end_month = str(request.get('end_month') or '')
          else:
              start_year = os.environ.get('INPUT_START_YEAR') or '2024'
              start_month = os.environ.get('INPUT_START_MONTH') or '1'
              end_year = os.environ.get('INPUT_END_YEAR') or ''
              end_month = os.environ.get('INPUT_END_MONTH') or ''

          if not start_year or not start_month:
              raise SystemExit('start_year and start_month are required')
          if bool(end_year) != bool(end_month):
              raise SystemExit('end_year and end_month must be provided together')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'start_year={start_year}\n')
              fh.write(f'start_month={start_month}\n')
              fh.write(f'end_year={end_year}\n')
              fh.write(f'end_month={end_month}\n')
          print(json.dumps({'start': f'{int(start_year):04d}-{int(start_month):02d}', 'end_year': end_year or None, 'end_month': end_month or None}))
          PY
      - id: plan
        shell: bash
        run: |
          ARGS="--start-year ${{ steps.request.outputs.start_year }} --start-month ${{ steps.request.outputs.start_month }}"
          if [ -n "${{ steps.request.outputs.end_year }}" ]; then ARGS="$ARGS --end-year ${{ steps.request.outputs.end_year }} --end-month ${{ steps.request.outputs.end_month }}"; fi
          python provider_analyzer/scripts/plan_backfill_matrix.py $ARGS --github-output
  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e provider_analyzer
      - name: Mark historical month as running
        run: python provider_analyzer/scripts/mark_provider_run.py --pipeline "BACKFILL_${{ matrix.period }}" --status RUNNING --period "${{ matrix.period }}"
      - name: Scan and persist aggregate historical month
        shell: bash
        run: |
          Y='${{ matrix.year }}'; M='${{ matrix.month }}'
          python provider_analyzer/scripts/build_chilecompra_order_month_summary.py --url "https://transparenciachc.blob.core.windows.net/oc-da/${Y}-${M}.zip" --year "$Y" --month "$M" --output-dir runtime/provider_analyzer/orders
          python provider_analyzer/scripts/build_chilecompra_tender_route_month.py --url "https://transparenciachc.blob.core.windows.net/lic-da/${Y}-${M}.zip" --year "$Y" --month "$M" --output-dir runtime/provider_analyzer/routes_month
          python provider_analyzer/scripts/persist_provider_month.py --history-month runtime/provider_analyzer/orders/history_month.json --purchase-events runtime/provider_analyzer/orders/purchase_events.jsonl.gz --tender-health runtime/provider_analyzer/routes_month/health.json --tender-events runtime/provider_analyzer/routes_month/tender_negative_events.jsonl.gz --skip-route-events
      - name: Mark historical month as successful
        if: success()
        run: python provider_analyzer/scripts/mark_provider_run.py --pipeline "BACKFILL_${{ matrix.period }}" --status SUCCESS --period "${{ matrix.period }}"
      - name: Mark historical month as failed
        if: failure()
        run: python provider_analyzer/scripts/mark_provider_run.py --pipeline "BACKFILL_${{ matrix.period }}" --status FAILED --period "${{ matrix.period }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: provider-backfill-failure-${{ matrix.period }}
          path: runtime/provider_analyzer/
          retention-days: 7
